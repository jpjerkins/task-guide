<title>Tag Entry Variants</title>

<!--
  PROTOTYPE — throwaway. Not production code.
  Question: what are the concrete controls for tag entry?
    1. ordinal axis — slider vs segmented vs stepper
    2. how the free-text field says "this will be inert" BEFORE commit
    3. how a muted (loose) tag reads next to normal chips
  Ticket: https://github.com/jpjerkins/task-guide/issues/38
  Companions: ui-screens.prototype.html (#12), schedule-editing.prototype.html (#17).
  In-memory only. No persistence, no tests, no error handling.

    A — Axis blocks     every axis always visible; ordinal = SEGMENTED with an absence segment
    B — One field       search-first; the registry answers as you type; ordinal = STEPPER
    C — The sentence    tags read as the constraint sentence; blanks open sheets; ordinal = SLIDER

  VERDICT: C — THE SENTENCE. Reached in three rounds, and the first two were wrong
  because the screen was wrong. Round 1 chose A on the grounds that the Task edit screen
  had room to show everything, so C would read as SHY — but that was judged against a
  screen missing half its fields (no Deadline, Defer, Postpone, Recurrence, CreatedAt or
  Opportunities). Round 2 added them all and reversed the density picture. Round 3 moved
  Tags above Timing, which is what finally made A and C comparable, and C won there.
  The lesson is about the method, not the widgets: a UI variant judged on density is
  being judged against whatever else is on the screen, so the screen has to be real
  first. Folded into CONTEXT.md; A and B kept here as the argument.

  The rounds, for the record:
    - every field from CONTEXT.md § Task is present, rendered IDENTICALLY in all three
      variants, because only the tag section is under test
    - KNOWN DEFECT, not this prototype's to fix: the native date input's picker
      dismisses itself in under a second on Mobile Safari. Tracked separately
    - the prototype's own commentary and the example list are OFF by default (the ⓘ
      button), so what you see on load is the screen's own density and nothing else
    - the ⧉ button cycles the fixture tasks: live, postponed, recurring, UNPROCESSED
      (no Duration) and STALE (undeadlined, 59 days old)
    - TAGS sit directly under Notes, above Timing — Timing is set once, Tags are the
      everyday surface (GTD contexts)
    - STATUS IS DERIVED, NOT TYPED. Done is the only bit the editor authors, as a
      checkbox beside the title, disabled while the Task is Unprocessed. Unprocessed
      and Stale are computed and surface as chips in the Opportunities bar. This is a
      DEPARTURE from CONTEXT.md § Status, which declares four exclusive typed values —
      flagged on the ticket, not folded in
    - the OPPORTUNITIES count is live and sticky, computed by the real matching rule
      against a week of fixture Windows — it is a consequence of the tags below it,
      so it has to stay visible while they are edited

  Registry rules obeyed as settled in #21 / CONTEXT.md:
    - tags are lowercase
    - a value name belongs to exactly one Dimension, so the STRING ALONE resolves it
    - a loose tag an ordinal axis claims is taken up only if that axis is unset
  Task rules obeyed as settled in #10 / #19 / CONTEXT.md:
    - Recurrence generates the Deadline, so a recurring Task never carries a hand-set one
    - a recurring Task's Defer must use the offset form
    - Postpone is authored ONLY by the "Not now" swipe, never as a field here
-->

<script>
/* ============================ registry ============================ */
// Declared in code, no UI (CONTEXT.md § Dimension). Values are lowercase and
// globally unique across the registry, which is what lets a bare string resolve.
const DIMS = [
  { key:"duration", label:"Duration", type:"ord", taskDef:null,
    values:["2 min","10 min","30 min","1 hour","longer"], short:["2m","10m","30m","1h","longer"] },
  { key:"energy", label:"Mental energy", type:"ord", taskDef:"low",
    values:["low","medium","high"], short:["low","medium","high"] },
  { key:"location", label:"Location", type:"cat",
    values:["home","desk","garage","outside","out & about"] },
  { key:"who", label:"With whom", type:"cat", values:["sam","ana","kids"] },
  { key:"weather", label:"Weather", type:"cat", values:["dry","fine"] },
];
const dim = k => DIMS.find(d => d.key === k);

// The whole of tag resolution: one lookup, no qualification, no ambiguity.
function resolve(raw) {
  const s = String(raw).trim().replace(/^#/, "").toLowerCase();
  if (!s) return null;
  for (const d of DIMS) {
    const i = d.values.findIndex(v => v.toLowerCase() === s);
    if (i >= 0) return { d, value:d.values[i] };
  }
  return null;
}

/* ============================ fixture ============================ */
// Chosen to exercise the three timing shapes: a plain one-off, a one-off with an
// offset Defer and a live Postpone, and a recurring Task (whose Deadline is generated
// and whose Defer must therefore use the offset form).
const TASKS = [
  { id:1, t:"Reseal the garage door", notes:"Sikaflex is on the shelf above the bench.",
    done:false, created:"2026-06-02", missed:0,
    timing:"once", deadline:"2026-08-25",
    defer:{ mode:"offset", date:"", n:2, unit:"weeks" }, postpone:null,
    rec:{ kind:"cal", n:1, unit:"weeks", days:["Sat"] },
    dims:{ duration:"30 min", energy:"medium", location:["garage"], weather:["dry"] },
    loose:["#springjob","#garge"] },
  { id:2, t:"Book the tournament hotel", notes:"https://example.com/bracket — Ana wants the one near the pitch.",
    done:false, created:"2026-08-04", missed:0,
    timing:"once", deadline:"2026-08-29",
    defer:{ mode:"none", date:"", n:1, unit:"weeks" }, postpone:"2026-08-21",
    rec:{ kind:"cal", n:1, unit:"weeks", days:["Sat"] },
    dims:{ duration:"10 min", location:["desk"] },
    loose:["#placetostay"] },
  { id:3, t:"Change the water filter", notes:"",
    done:false, created:"2026-02-14", missed:0,
    timing:"recur", deadline:"",
    defer:{ mode:"offset", date:"", n:3, unit:"days" }, postpone:null,
    rec:{ kind:"done", n:6, unit:"months", days:["Sat"] },
    dims:{ duration:"10 min", location:["home"] },
    loose:[] },
  // No Duration — captured by a path that couldn't ask. This is what Unprocessed IS,
  // so it is derived here rather than typed: give it a Duration and it becomes Active.
  { id:4, t:"Ring the dentist back", notes:"",
    done:false, created:"2026-08-10", missed:0,
    timing:"once", deadline:"",
    defer:{ mode:"none", date:"", n:1, unit:"weeks" }, postpone:null,
    rec:{ kind:"cal", n:1, unit:"weeks", days:["Sat"] },
    dims:{}, loose:[] },
  // Undeadlined, and 59 days old — past #29's 21-day threshold, so Stale.
  { id:5, t:"Sort out the loft boxes", notes:"",
    done:false, created:"2026-06-20", missed:0,
    timing:"once", deadline:"",
    defer:{ mode:"none", date:"", n:1, unit:"weeks" }, postpone:null,
    rec:{ kind:"cal", n:1, unit:"weeks", days:["Sat"] },
    dims:{ duration:"longer", energy:"medium", location:["home"] },
    loose:[] },
];
const TODAY = "2026-08-18";

// A week of Availability Windows, so Opportunities is a real count rather than a
// number typed into a mockup. Duration on the window side is DERIVED from its length
// (#7), which is why these carry a length rather than a duration value.
const WINDOWS = [
  { day:"Tue", name:"Early desk",   mins:30,  dims:{ location:["desk","home"], energy:"high" } },
  { day:"Tue", name:"Evening",      mins:60,  dims:{ location:["home"], energy:"low", who:["ana"] } },
  { day:"Wed", name:"Lunch walk",   mins:30,  dims:{ location:["out & about"], energy:"low" } },
  { day:"Wed", name:"Evening",      mins:60,  dims:{ location:["home"], energy:"medium", who:["ana"] } },
  { day:"Thu", name:"Early desk",   mins:30,  dims:{ location:["desk","home"], energy:"high" } },
  { day:"Thu", name:"Kids' bedtime",mins:10,  dims:{ location:["home"], energy:"low", who:["kids"] } },
  { day:"Fri", name:"Evening",      mins:60,  dims:{ location:["home"], energy:"low", who:["ana"] } },
  { day:"Sat", name:"Garage slot",  mins:120, dims:{ location:["garage","outside"], energy:"medium", weather:["dry"] } },
  { day:"Sat", name:"Kids' morning",mins:120, dims:{ location:["outside"], energy:"medium", who:["kids"], weather:["dry","fine"] } },
  { day:"Sun", name:"Errands",      mins:60,  dims:{ location:["out & about"], energy:"medium" } },
  { day:"Sun", name:"Evening",      mins:60,  dims:{ location:["home"], energy:"low", who:["ana"] } },
  { day:"Mon", name:"Early desk",   mins:30,  dims:{ location:["desk","home"], energy:"high" } },
  { day:"Mon", name:"Kids' bedtime",mins:10,  dims:{ location:["home"], energy:"low", who:["kids"] } },
  { day:"Tue", name:"Garage slot",  mins:120, dims:{ location:["garage","outside"], energy:"medium", weather:["dry"] } },
];
const DUR_MINS = { "2 min":2, "10 min":10, "30 min":30, "1 hour":60, "longer":180 };

// The Matching rule, both algebras. Categorical: the task's values must be a SUBSET of
// the window's. Ordinal: the task's value must not exceed the window's ceiling.
// An Unprocessed Task has no Duration, so it fits nothing — which is what Unprocessed means.
function fits(t, w) {
  const need = DUR_MINS[t.dims.duration] ?? Infinity;
  if (need > w.mins) return false;
  const eOrder = dim("energy").values;
  const te = t.dims.energy ?? dim("energy").taskDef;
  const we = w.dims.energy ?? dim("energy").taskDef;
  if (eOrder.indexOf(te) > eOrder.indexOf(we)) return false;
  for (const d of DIMS) {
    if (d.type !== "cat") continue;
    const tv = t.dims[d.key] ?? [], wv = w.dims[d.key] ?? [];
    if (!tv.every(x => wv.includes(x))) return false;
  }
  return true;
}
const opportunities = t => WINDOWS.filter(w => fits(t, w)).length;

// Which single constraint is doing the excluding — the repair hint an Orphan needs.
function blockers(t) {
  const out = [];
  for (const d of DIMS) {
    if (d.type !== "cat") continue;
    for (const v of (t.dims[d.key] ?? []))
      if (!WINDOWS.some(w => (w.dims[d.key] ?? []).includes(v))) out.push(v);
  }
  return out;
}

const S = { variant:"A", id:1, draft:"", sheet:null, scaffold:false };
const task = () => TASKS.find(t => t.id === S.id);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const valuesOf = (t, d) => { const v = t.dims[d.key]; return v === undefined ? [] : (Array.isArray(v) ? v.slice() : [v]); };

const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T12:00:00");
  return `${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()}`;
}
// Recurrence GENERATES the deadline (#10), so the screen shows it derived, never editable.
function nextDue(t) {
  const base = new Date((t.rec.kind === "done" ? "2026-05-30" : "2026-08-18") + "T12:00:00");
  const n = t.rec.n;
  if (t.rec.unit === "days") base.setDate(base.getDate() + n);
  else if (t.rec.unit === "weeks") base.setDate(base.getDate() + n * 7);
  else base.setMonth(base.getMonth() + n);
  return base.toISOString().slice(0,10);
}
const effectiveDeadline = t => t.timing === "recur" ? nextDue(t) : t.deadline;

function toggleCat(t, d, v) {
  const cur = valuesOf(t, d);
  const next = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat([v]);
  if (next.length) t.dims[d.key] = next; else delete t.dims[d.key];
}
function setOrd(t, d, v) { if (v === null) delete t.dims[d.key]; else t.dims[d.key] = v; }

// Committing the free-text field. This is the whole entry rule from #21, live:
// a claimed string lands on its Dimension; anything else lands in the loose bag.
// An ordinal axis that already holds a value does NOT take the tag — it stays loose.
function commitDraft() {
  const raw = S.draft.trim(); if (!raw) return;
  const t = task(), r = resolve(raw);
  if (r && r.d.type === "cat") {
    if (!valuesOf(t, r.d).includes(r.value)) toggleCat(t, r.d, r.value);
  } else if (r && r.d.type === "ord" && t.dims[r.d.key] === undefined) {
    setOrd(t, r.d, r.value);
  } else {
    const norm = "#" + raw.replace(/^#/, "").toLowerCase();
    if (!t.loose.includes(norm)) t.loose.push(norm);
  }
  S.draft = ""; render();
}

/* ---- the verdict: what the field says BEFORE you commit ---- */
function verdict(draft) {
  const raw = draft.trim();
  if (!raw) return { cls:"idle", mark:"", html:"A value the registry knows lands on its axis. Anything else is kept, shown, and ignored by matching." };
  const r = resolve(raw), t = task();
  if (r && r.d.type === "cat")
    return { cls:"claimed", mark:"→", html:`<b>${esc(r.d.label)}</b> claims <b>${esc(r.value)}</b>. It will be set there — not a loose tag.` };
  if (r && r.d.type === "ord" && t.dims[r.d.key] === undefined)
    return { cls:"claimed", mark:"→", html:`<b>${esc(r.d.label)}</b> claims <b>${esc(r.value)}</b>, and that axis is unset, so it will be set there.` };
  if (r)
    return { cls:"inert", mark:"◇", html:`<b>${esc(r.d.label)}</b> claims <b>${esc(r.value)}</b>, but it already holds <b>${esc(t.dims[r.d.key])}</b> — a value chosen by hand is never overruled. This stays <b>loose</b>.` };
  return { cls:"inert", mark:"◇", html:`No Dimension claims <b>${esc("#" + raw.replace(/^#/,"").toLowerCase())}</b>. It will be <b>kept and shown, but ignored by matching</b> until some Dimension declares it.` };
}

/* ==================== the fields that are NOT under test ====================
   Identical in all three variants, so the only thing differing between them is
   the tag section. Every property in CONTEXT.md § Task is here.
   ========================================================================== */
function identityFields() {
  const t = task();
  return `<div class="stack">
      <div class="lbl">Title</div>
      <input class="field" value="${esc(t.t)}">
      <div class="lbl">Notes</div>

    </div>`;
}

// Below the Tags, because Timing is set once and Tags are the everyday surface.
function timingFields() {

    <div class="stack">

        <button data-act="timing" data-v="recur" aria-pressed="${recurring}">Recurring</button>
      </div>

      ${recurring ? `
        <div class="lbl">Rule</div>
        <div class="seg">

        <div class="derived"><span>Next due</span><b>${esc(fmtDate(nextDue(t)))}</b>
          <span style="margin-left:auto">generated by the rule</span></div>
        <div class="hint">${r.kind === "done"
          ? `Doing it restarts the clock, so this can never build up a backlog.`

      ` : `

      ${t.defer.mode === "offset" ? `
        <div class="inline">
          <div class="step small" style="flex:0 0 118px">
            <button class="bump" data-act="defn" data-dir="-1" ${t.defer.n <= 1 ? "disabled" : ""}>−</button>
            <div class="val">${t.defer.n}</div>
            <button class="bump" data-act="defn" data-dir="1">+</button>
          </div>
          <div class="chipset tight">${["days","weeks","months"].map(u =>
            `<button data-act="defunit" data-v="${u}" aria-pressed="${t.defer.unit === u}">${u}</button>`).join("")}</div>
          <span class="hint">before</span>
        </div>
        <div class="derived"><span>Surfaces</span><b>${esc(fmtDate(effectiveDeadline(t)) === "—" ? "" : deferDate(t))}</b></div>` : ""}
      ${recurring ? `<div class="hint">A recurring Task must defer by offset — an absolute date would

      ${t.postpone ? `
        <div class="stateline"><span>Postponed — won't surface until <b>${esc(fmtDate(t.postpone))}</b></span>

}
function deferISO(t) {
  if (t.defer.mode === "none") return null;
  if (t.defer.mode === "date") return t.defer.date || null;
  const iso = effectiveDeadline(t); if (!iso) return null;
  const d = new Date(iso + "T12:00:00"), n = t.defer.n;
  if (t.defer.unit === "days") d.setDate(d.getDate() - n);
  else if (t.defer.unit === "weeks") d.setDate(d.getDate() - n * 7);
  else d.setMonth(d.getMonth() - n);
  return d.toISOString().slice(0,10);
}
function deferDate(t) {
  const iso = effectiveDeadline(t); if (!iso) return "—";
  const d = new Date(iso + "T12:00:00"), n = t.defer.n;
  if (t.defer.unit === "days") d.setDate(d.getDate() - n);
  else if (t.defer.unit === "weeks") d.setDate(d.getDate() - n * 7);
  else d.setMonth(d.getMonth() - n);
  return fmtDate(d.toISOString().slice(0,10));
}
// Status, derived rather than typed. Done is the only bit the editor authors; the
// other three fall out of facts the Task already carries.
//   Unprocessed — captured without the information matching needs (i.e. no Duration)
//   Stale       — #29: undeadlined one-off past 21 days, or 3 consecutive missed instances
//   Active      — the residue
const ageDays = t => Math.round((new Date(TODAY) - new Date(t.created)) / 86400000);
const isUnprocessed = t => t.dims.duration === undefined;
function isStale(t) {
  if (t.done || isUnprocessed(t)) return false;
  if (t.timing === "recur") return t.missed >= 3;
  if (t.deadline) return false;           // a Deadline is direct evidence against the age proxy
  return ageDays(t) > 21;
}
const statusLabel = t => t.done ? "Done" : isUnprocessed(t) ? "Unprocessed" : "Active";

// Sticky, and identical in all three variants — Opportunities is a consequence of the
// tags below it, so it is the one readout that has to stay visible while they are edited.
function fitBar() {
  const t = task();
  // eligible = Active AND not Stale AND now >= Defer AND now >= Postpone. A Defer that
  // has already elapsed is not a gate, which is why this compares dates, not presence.
  const dISO = deferISO(t), stale = isStale(t), unproc = isUnprocessed(t);
  const gate = t.done ? `it is <b>done</b>`
    : unproc ? `it still needs a <b>Duration</b> before it can be matched`
    : stale ? `it has gone <b>stale</b> — reword it, slice it smaller, or delete it`
    : (t.postpone && t.postpone > TODAY) ? `it is <b>postponed</b> until ${esc(fmtDate(t.postpone))}`
    : (dISO && dISO > TODAY) ? `it is <b>deferred</b> until ${esc(fmtDate(dISO))}`
    : null;
  const n = opportunities(t), bl = blockers(t);
  // #37: a gated Task is never an Orphan. The count is still shown — it is a fact about
  // the tags — but the bar says plainly that nothing is being matched right now.
  const cls = t.done ? "done" : stale ? "scarce" : gate ? "gated" : n === 0 ? "orphan" : n <= 2 ? "scarce" : "";
  const flags = [
    unproc ? "Unprocessed" : "",
    stale ? "Stale" : "",
    (!gate && n === 0) ? "Orphan" : "",
  ].filter(Boolean).map(f => `<span class="pill flag">${f}</span>`).join("");
  return `<div class="fitbar ${cls}">
    <span class="n">${n}</span>
    <span>${n === 1 ? "opportunity" : "opportunities"} in the next 7 days</span>
    ${flags}
    ${gate
      ? `<span class="which">Not being matched at all right now — ${gate}.${
          stale || unproc ? "" : " Gates decide <i>whether</i>, tags decide <i>where</i>, so this is not an Orphan."}${
          stale ? ` Undeadlined and ${ageDays(t)} days old.` : ""}</span>`
      : n === 0
      ? `<span class="which">${bl.length
          ? `No window declares ${bl.map(b => `<b>${esc(b)}</b>`).join(" or ")} — relax it here, or declare it on a window.`
          : `No single tag is to blame; the combination has no home in this pattern.`}</span>`
      : n <= 2
      ? `<span class="which">Scarce — it will rank high wherever it does fit.</span>`
      : ""}
  </div>`;
}
const createdLine = () => `<div class="created">Captured ${esc(fmtDate(task().created))} · age drives the staleness gate</div>`;

        ${DIMS.filter(d => d.type === "ord").map(d => {
          const i = d.values.indexOf(t.dims[d.key]), unset = i < 0;
          return `<div class="seg-wrap"><div class="lbl">${esc(d.label)}</div>
            <div class="step">
              <button class="bump" data-act="step" data-k="${d.key}" data-dir="-1" ${unset || i === 0 ? "disabled" : ""}>−</button>
              <div class="val ${unset ? "unset" : ""}">${unset
                ? (d.taskDef ? esc(d.taskDef) + " (default)" : "not set — required")
                : esc(d.values[i])}</div>
              <button class="bump" data-act="step" data-k="${d.key}" data-dir="1" ${!unset && i === d.values.length-1 ? "disabled" : ""}>+</button>
            </div></div>`;
        }).join("")}
      </div>
      ${timingFields()}
      ${createdLine()}
      <div class="btn-row"><button class="btn primary wide">Save</button></div>
      ${brief(B)}
      ${elsewhere("loose-b")}</div>`;
  },
};

/* ============================ variant C ============================ */
const C = {
  key:"C", name:"The sentence",
  tagline:"Tags render as the constraint sentence CONTEXT.md insists they are — <i>\"this cannot be done without…\"</i>. Each blank opens a sheet; ordinal axes are a <b>slider</b> in that sheet.",
  tradeoffs:[
    "Ordinal control: <b>slider</b> with labelled ticks. Reads as a magnitude, which matches \"no more than this much\" — but a slider has <b>no absence position</b>, so the default needs its own switch above it. That extra control is the finding.",
    "Inert signal: structural. A loose tag <b>cannot enter the sentence</b> — it drops to a shelf underneath.",
    "Muting: not a chip treatment but a <b>place</b>.",
    "Cost: every change is a sheet. Its gain is that it stays the same height however many axes the registry grows to.",
  ],
  slot(d) {
    const t = task(), v = valuesOf(t, d);
    return v.length
      ? `<button class="slot" data-act="sheet" data-k="${d.key}">${esc(v.join(" + "))}</button>`
      : `<button class="slot empty" data-act="sheet" data-k="${d.key}">${esc(d.label.toLowerCase())}</button>`;
  },
  render() {
    const t = task(), dur = t.dims.duration, en = t.dims.energy;
    return nav("Full task editor — the sentence") + `<div class="scroll">
      ${fitBar()}
      ${identityFields()}
      <div class="sec-h">Tags</div>
      <div class="card"><div class="sentence">
        Do it at ${this.slot(dim("location"))},
        with ${this.slot(dim("who"))},
        when it is ${this.slot(dim("weather"))}.<br>
        It takes <button class="slot ${dur ? "" : "empty"}" data-act="sheet" data-k="duration">${esc(dur || "how long?")}</button>
        and needs no more than
        <button class="slot ${en ? "" : "empty"}" data-act="sheet" data-k="energy">${esc(en || "low (default)")}</button> attention.
      </div></div>
      <div class="stack">${freeField("Add a tag…")}</div>
      <div class="shelf">
        <div class="sh-h">Shelf — means nothing yet</div>
        <div class="chipset">${t.loose.length
          ? t.loose.map(x => `<span class="pill loose">${esc(x)}</span>`).join("")
          : `<span class="hint">Empty. Tags here are kept and shown, and matching ignores them.</span>`}</div>
      </div>
      ${timingFields()}
      ${createdLine()}
      <div class="btn-row"><button class="btn primary wide">Save</button></div>
      ${brief(C)}
      ${elsewhere("loose")}</div>`;
  },
  sheet() {
    const d = dim(S.sheet), t = task();
    if (!d) return "";
    let body;
    if (d.type === "ord") {
      const i = d.values.indexOf(t.dims[d.key]), unset = i < 0;
      body = `<div class="stack">
        ${d.taskDef !== null ? `<div class="chipset"><button data-act="ord" data-k="${d.key}" data-v=""
            aria-pressed="${unset}">Leave at the default (${esc(d.taskDef)})</button></div>` : ""}
        <input class="range" type="range" min="0" max="${d.values.length-1}" step="1"
          value="${unset ? 0 : i}" data-act="range" data-k="${d.key}" ${unset ? 'style="opacity:.4"' : ""}>
        <div class="ticks">${d.values.map(v => `<span>${esc(v)}</span>`).join("")}</div>
        <div class="hint">${unset
          ? `Nothing chosen — the slider is showing <b>${esc(d.values[0])}</b> but the task carries the default. Touch it to commit a value.`
          : `Set to <b>${esc(d.values[i])}</b>.`}</div>
      </div>`;
    } else {
      body = `<div class="stack"><div class="chipset">${d.values.map(v =>
        `<button data-act="cat" data-k="${d.key}" data-v="${esc(v)}"
          aria-pressed="${valuesOf(t,d).includes(v)}">${esc(v)}</button>`).join("")}</div>
        <div class="hint">A categorical axis takes several — every one you add is another thing the window must declare.</div></div>`;
    }
    return `<div class="scrim" data-act="close"></div><div class="sheet"><div class="grabber"></div>
      <div class="sheet-h"><h2>${esc(d.label)}</h2><button data-act="close">Done</button></div>
      ${body}</div>`;
  },
};

const VARIANTS = { A, B, C };

/* ============================ render ============================ */
function render() {
  const V = VARIANTS[S.variant];
  document.getElementById("device").innerHTML =
    V.render() + (S.variant === "C" && S.sheet ? C.sheet() : "");
  document.getElementById("switcher").innerHTML =
    `<button data-nav="-1">‹</button><div class="cur">${V.key} — ${V.name}
      <small>#38 · ?variant=${V.key}</small></div><button data-nav="1">›</button>
     <div class="div"></div>
     <button data-task="1" title="next fixture task">⧉</button>
     <button data-scaffold="1" aria-pressed="${S.scaffold}" title="prototype commentary">ⓘ</button>`;
  const f = document.getElementById("draft");
  if (f && S.focusDraft) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
}

function go(delta) {
  const keys = Object.keys(VARIANTS);
  const i = (keys.indexOf(S.variant) + delta + keys.length) % keys.length;
  S.variant = keys[i]; S.sheet = null; S.draft = ""; S.focusDraft = false;
  const u = new URL(location); u.searchParams.set("variant", S.variant);
  history.replaceState(null, "", u); render();
}

document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) return go(+nav.dataset.nav);
  if (e.target.closest("[data-task]")) {
    const i = TASKS.findIndex(x => x.id === S.id);
    S.id = TASKS[(i + 1) % TASKS.length].id; S.draft = ""; S.sheet = null; return render();
  }
  if (e.target.closest("[data-scaffold]")) { S.scaffold = !S.scaffold; return render(); }

  const el = e.target.closest("[data-act]"); if (!el) return;
  const t = task(), k = el.dataset.k, v = el.dataset.v;
  switch (el.dataset.act) {
    case "cat": toggleCat(t, dim(k), v); break;
    case "ord": setOrd(t, dim(k), v === "" ? null : v); break;
    case "step": {
      const d = dim(k), i = d.values.indexOf(t.dims[d.key]), dir = +el.dataset.dir;
      if (i < 0) setOrd(t, d, d.values[0]);
      else setOrd(t, d, d.values[Math.max(0, Math.min(d.values.length-1, i + dir))]);
      break;
    }
    case "pick": {
      const d = dim(k);
      if (d.type === "cat") { if (!valuesOf(t,d).includes(v)) toggleCat(t, d, v); }
      else if (t.dims[d.key] === undefined) setOrd(t, d, v);
      else { const n = "#" + v.toLowerCase(); if (!t.loose.includes(n)) t.loose.push(n); }
      S.draft = ""; break;
    }
    case "loose": {
      const n = "#" + S.draft.trim().replace(/^#/,"").toLowerCase();
      if (n.length > 1 && !t.loose.includes(n)) t.loose.push(n);
      S.draft = ""; break;
    }
    case "done": if (!isUnprocessed(t)) t.done = !t.done; break;
    case "timing":
      t.timing = v;
      // Recurrence generates the Deadline, and a recurring Task's Defer must be an offset.
      if (v === "recur" && t.defer.mode === "date") t.defer.mode = "offset";
      break;
    case "reckind": t.rec.kind = v; break;
    case "recn": t.rec.n = Math.max(1, t.rec.n + (+el.dataset.dir)); break;
    case "recunit": t.rec.unit = v; break;
    case "recday":
      t.rec.days = t.rec.days.includes(v) ? t.rec.days.filter(x => x !== v) : t.rec.days.concat([v]);
      break;
    case "defer": t.defer.mode = v; break;
    case "defn": t.defer.n = Math.max(1, t.defer.n + (+el.dataset.dir)); break;
    case "defunit": t.defer.unit = v; break;
    case "unpostpone": t.postpone = null; break;
    case "sheet": S.sheet = k; break;
    case "close": S.sheet = null; break;
  }
  S.focusDraft = false; render();
});

document.addEventListener("input", e => {
  const t = task();
  if (e.target.id === "draft") { S.draft = e.target.value; S.focusDraft = true; return render(); }
  const act = e.target.dataset && e.target.dataset.act;
  if (act === "range") { const d = dim(e.target.dataset.k); setOrd(t, d, d.values[+e.target.value]); return render(); }
  if (act === "deadline") { t.deadline = e.target.value; if (!t.deadline && t.defer.mode === "offset") t.defer.mode = "none"; return render(); }
  if (act === "deferdate") { t.defer.date = e.target.value; }
});

document.addEventListener("keydown", e => {
  const t = e.target;
  const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
  if (typing) { if (e.key === "Enter" && t.id === "draft") { e.preventDefault(); commitDraft(); } return; }
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

S.variant = (new URL(location).searchParams.get("variant") || "A").toUpperCase();
if (!VARIANTS[S.variant]) S.variant = "A";
render();
</script>
