(() => {
  "use strict";

  /* ============================ fake data ============================ */

  const DIMS = [
    { key:"location", label:"Location",      type:"cat",  taskDef:"home",   winDef:"home",   any:"anywhere",

      values:["any","dry","fine"] },

  const dim = k => DIMS.find(d => d.key === k);

  const DURS = [2,10,30,60,"Longer"];
  const durMins = d => d === "Longer" ? 150 : d;
  const durLabel = d => d === "Longer" ? "Longer" : d + "m";

  let TASKS = [
    { id:1, t:"Call the bank about the mortgage", dur:10, st:"Active", due:iso(dAdd(6)),
      notes:"Ask for the fixed-rate sheet before the renewal date.", dims:{ energy:"high", location:"desk" } },
    { id:2, t:"Fix the gutter bracket", dur:30, st:"Active", dims:{ location:"outside", weather:"dry", energy:"medium" } },
    { id:3, t:"Email Sam about the tournament car share", dur:2, st:"Active", dims:{ energy:"low" }, tags:["#sam"] },
    { id:4, t:"Oil the bike chain", dur:10, st:"Active", dims:{ location:"garage" } },
    { id:5, t:"Draft the Q3 numbers", dur:60, st:"Active", due:iso(dAdd(9)), dims:{ energy:"high", location:"desk" } },

    { id:7, t:"Renew the car registration", dur:10, st:"Active", due:iso(dAdd(12)), dims:{ energy:"medium", location:"desk" } },
    { id:8, t:"Sort out the loft", dur:"Longer", st:"Active", dims:{ location:"home", energy:"medium" } },

    { id:10, t:"Replace the shed padlock", dur:10, st:"Active", dims:{ location:"outside", weather:"dry" } },
    { id:20, t:"gutter thing??", dur:null, st:"Unprocessed", dims:{} },
    { id:21, t:"look into the loft hatch", dur:null, st:"Unprocessed", dims:{} },
    { id:22, t:"ring re: warranty", dur:null, st:"Unprocessed", dims:{} },
    { id:23, t:"that thing Ana mentioned", dur:null, st:"Unprocessed", dims:{} },
    { id:24, t:"bike?", dur:null, st:"Unprocessed", dims:{} },
    { id:25, t:"tax folder", dur:null, st:"Unprocessed", dims:{} },
    { id:30, t:"Reorganise the entire garage", dur:"Longer", st:"Stale", dims:{ location:"garage" } },
    { id:31, t:"Learn some Portuguese", dur:30, st:"Stale", dims:{} },
    { id:32, t:"Sort the photo backlog", dur:"Longer", st:"Stale", dims:{ location:"desk" } },
  ];
  const task = id => TASKS.find(t => t.id === id);

  const TEMPLATES = [
    { id:"ord", name:"Ordinary weekday", windows:[
      { name:"Morning admin",  s:"07:00", e:"08:00", dims:{ location:"desk", energy:"high" } },
      { name:"Lunch gap",      s:"12:15", e:"12:45", dims:{ energy:"low" } },
      { name:"Evening prep",   s:"18:00", e:"20:00", dims:{ location:"home", energy:"medium" } },
    ], protos:[] },
    { id:"vol", name:"Volleyball Tuesday", windows:[
      { name:"Morning admin",  s:"07:00", e:"08:00", dims:{ location:"desk", energy:"high" } },
      { name:"Sports hall wait", s:"18:30", e:"20:00", dims:{ location:"out & about", energy:"low", who:"anyone" } },
      { name:"Short evening",  s:"21:15", e:"22:00", dims:{ location:"home", energy:"low" } },
    ], protos:[] },
    { id:"tour", name:"Tournament Saturday", windows:[
      { name:"Car park downtime", s:"10:00", e:"15:00", dims:{ location:"out & about", energy:"low" } },
    ], protos:[] },
    { id:"sat", name:"Ordinary Saturday", windows:[
      { name:"Jobs morning",   s:"09:00", e:"12:00", dims:{ location:"outside", energy:"medium", weather:"dry" } },
      { name:"Evening prep",   s:"18:00", e:"20:00", dims:{ location:"home", energy:"medium" } },
    ], protos:[] },
    { id:"trav", name:"Travel day", windows:[
      { name:"On the road",    s:"09:00", e:"13:00", dims:{ location:"out & about", energy:"low" } },
    ], protos:[] },
    { id:"church", name:"Church Sunday", windows:[
      { name:"Slow afternoon", s:"14:00", e:"17:00", dims:{ location:"home", energy:"low" } },
    ], protos:[{ name:"Church", s:"10:00", e:"11:30" }] },
  ];
  const tpl = id => TEMPLATES.find(t => t.id === id);

  const PATTERNS = [
    { id:"vball",  name:"Volleyball season", days:["church","ord","vol","ord","ord","ord","tour"] },
    { id:"school", name:"School year",       days:["church","ord","ord","ord","ord","ord","sat"] },
    { id:"summer", name:"Summer",            days:["church","sat","sat","sat","sat","sat","sat"] },
  ];
  let activePattern = "vball";
  const pattern = () => PATTERNS.find(p => p.id === activePattern);

  // sparse dated records layered on top of the pattern
  let OVERRIDES = [
    { date:iso(dAdd(6)),  from:"trav", label:"Travel day", windows:null },
    { date:iso(dAdd(7)),  from:null,   label:"One-off day", windows:[
      { name:"Hotel morning", s:"08:00", e:"09:30", dims:{ location:"out & about", energy:"low" } } ] },
  ];
  let EVENTS = [
    { name:"Band concert", date:iso(dAdd(2)), s:"19:00", e:"20:30", dims:{ who:"the kids" } },
    { name:"Ana's flight", date:iso(dAdd(6)), s:"11:20", e:"12:00", dims:{} },
  ];

  /* ==================== derived: day shape + matching ==================== */
  function dayShape(d) {
    const key = iso(d);
    const ov = OVERRIDES.find(o => o.date === key);
    if (ov) {
      const ws = ov.windows || tpl(ov.from).windows.map(w => ({ ...w, dims:{ ...w.dims } }));
      return { source:"override", label:ov.label, stamped:ov.from, windows:ws };
    }
    const t = tpl(pattern().days[d.getDay()]);
    return { source:"pattern", label:t.name, tplId:t.id, windows:t.windows };
  }
  const eventsOn = d => EVENTS.filter(e => e.date === iso(d));

  const mins = hhmm => (+hhmm.slice(0,2)) * 60 + (+hhmm.slice(3));
  const winMins = w => mins(w.e) - mins(w.s);

  // A query is what matching actually runs against. A window yields one; the landing page
  // may then adjust it for this fire only. Categorical axes hold a SET of values —
  // "carries the value" is set membership, which is what makes ad-hoc widening expressible.
  // ADDITIVE, not replacing: the window-side default is never excluded, and a declared
  // non-default value LIFTS the exclude for that value (and boosts it). So the admitted
  // set is {window default} ∪ {declared} — derived, never stored as a set.
  function baseQuery(w) {
    const q = { mins:winMins(w), label:w.name };
    for (const d of DIMS) {
      if (d.type === "ord") { q[d.key] = w.dims[d.key] ?? d.winDef; continue; }
      const declared = w.dims[d.key];
      q[d.key] = (declared === undefined || declared === d.winDef) ? [d.winDef] : [d.winDef, declared];
    }
    return q;
  }
  function openQuery() {
    const q = { mins:600, label:"Right now" };
    for (const d of DIMS) q[d.key] = d.type === "ord" ? d.winDef : [d.winDef];
    return q;
  }
  function effQuery(w) {
    const q = w ? baseQuery(w) : openQuery();
    if (S.adjust) for (const k of Object.keys(S.adjust)) q[k] = S.adjust[k];
    return q;
  }
  function matchesQ(t, q) {
    if (t.st !== "Active") return false;
    if (durMins(t.dur) > q.mins) return false;
    for (const d of DIMS) {
      const tv = t.dims[d.key] ?? d.taskDef;
      if (d.type === "ord") {
        if (d.values.indexOf(tv) > d.values.indexOf(q[d.key])) return false;
      } else {
        const set = q[d.key];
        if (set.includes(d.any) || tv === d.any) continue;
        if (!set.includes(tv)) return false;
      }
    }
    return true;
  }
  const matches = (t, w) => matchesQ(t, baseQuery(w));
  function boost(t, w) {
    let n = 0;
    for (const d of DIMS) {
      const wv = w.dims[d.key];
      if (wv === undefined || wv === d.winDef) continue;
      if ((t.dims[d.key] ?? d.taskDef) === wv) n++;
    }
    return n;
  }
  function rank(list, w) {
    return list.sort((a, b) => {
      const ad = a.due ? new Date(a.due) - today : 1e9;
      const bd = b.due ? new Date(b.due) - today : 1e9;
      if (ad !== bd) return ad - bd;
      return (w ? boost(b, w) - boost(a, w) : 0);
    });
  }
  const matchesFor = w => rank(TASKS.filter(t => matchesQ(t, baseQuery(w))), w);
  const matchesForQ = (q, w) => rank(TASKS.filter(t => matchesQ(t, q)), w);
  const countBy = st => TASKS.filter(t => t.st === st).length;

  // dated events surface in the footer for the 3 days up to and including the day
  function footerEvents() {
    return EVENTS.filter(e => {
      const n = Math.round((new Date(e.date) - today) / DAY);
      return n >= 0 && n <= 2;
    });
  }

  /* ============================== state ============================== */
  const S = {
    variant: new URLSearchParams(location.search).get("variant") || "D",
    screen: "home",
    param: null,
    filter: "Active",
    date: iso(today),
    sheet: null,
    about: false,
    adjust: null,      // per-dimension overrides of the query, this fire only
    adjustOpen: false,
  };
  const curDate = () => { const d = new Date(S.date + "T00:00:00"); return d; };
  const liveWindow = () => {
    if (S.date !== iso(today)) return null;
    const now = new Date().getHours() * 60 + new Date().getMinutes();
    return dayShape(today).windows.find(w => mins(w.s) <= now && now < mins(w.e)) || null;
  };
  const nextWindow = () => dayShape(today).windows.find(w => mins(w.s) > (new Date().getHours()*60 + new Date().getMinutes())) || null;

  function go(screen, param) {
    S.screen = screen; S.param = param ?? null; S.sheet = null;
    S.adjust = null; S.adjustOpen = false;   // an adjustment never outlives the screen
    render();
  }
  function sheet(kind, param) { S.sheet = kind ? { kind, param } : null; render(); }

  /* ============================ components ============================ */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  function dimPills(dims, extraTags) {
    const out = DIMS.filter(d => dims[d.key] !== undefined)
      .map(d => `<span class="pill dim">${esc(d.label.toLowerCase())}: ${esc(dims[d.key])}</span>`);
    (extraTags || []).forEach(t => out.push(`<span class="pill inert">${esc(t)} · inert</span>`));
    return out.join("");
  }
  function duePill(t) {
    if (!t.due) return "";
    const n = Math.round((new Date(t.due) - today) / DAY);
    const cls = n <= 3 ? "pill due" : "pill";
    return `<span class="${cls}">due ${n === 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + "d"}</span>`;
  }
  function taskRow(t, opts = {}) {
    return `<div class="row">
      <button class="tick" data-done="${t.st === "Done" ? 1 : 0}" data-act="toggle" data-id="${t.id}" aria-label="Mark ${esc(t.t)} done">✓</button>
      <button class="body" style="background:none;border:none;padding:0;font:inherit;color:inherit;text-align:left"
              data-act="task" data-id="${t.id}">
        <div class="title" style="${t.st === "Done" ? "opacity:.45;text-decoration:line-through" : ""}">${esc(t.t)}</div>
        <div class="meta">
          ${t.dur ? `<span class="pill dur">${durLabel(t.dur)}</span>` : `<span class="pill due">no duration</span>`}
          ${duePill(t)}
          ${opts.dims === false ? "" : dimPills(t.dims, t.tags)}
        </div>
      </button>
      <span class="chev">›</span>
    </div>`;
  }
  function footerBar() {
    const ev = footerEvents();
    return `<div class="footer-count">
      <span class="pill">${countBy("Unprocessed")} to process</span>
      <span class="pill">${countBy("Stale")} stale</span>
      ${ev.map(e => `<span class="pill now">${esc(e.name)} · ${WDL[new Date(e.date + "T00:00:00").getDay()]}</span>`).join("")}
    </div>`;
  }
  const addBtn = `<button class="nav-add" data-act="sheet" data-kind="capture" aria-label="Quick add a task">＋</button>`;
  function nav(title, o = {}) {
    // In D the quick-add circle owns the nav's right slot on EVERY screen — screens that
    // want that slot for something else have to put it somewhere better.
    const right = S.variant === "D" ? addBtn : (o.right || "");
    return `<div class="nav">
      <div class="nav-main">
        ${o.back ? `<button class="icon" data-act="go" data-screen="${o.back}" data-param="${o.backParam || ""}">‹ ${esc(o.backLabel || "Back")}</button>` : ""}
        <h1>${esc(title)}</h1>
        ${right}
      </div>
      ${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ""}
    </div>`;
  }
  function tabbar(_items, active) {
    const items = TABS[S.variant] || TABS.A;
    return `<div class="tabbar">${items.map(i => `
      <button data-act="go" data-screen="${i.k}" ${i.k === active ? 'aria-current="page"' : ""}>
        <span class="g">${i.g}</span>${esc(i.l)}
      </button>`).join("")}</div>`;
  }
  function windowLine(w, d) {
    const n = matchesFor(w).length;
    return `<button class="row" data-act="landing" data-win="${esc(w.name)}">
      <div class="body">
        <div class="title">${esc(w.name)}</div>
        <div class="meta">
          <span class="pill dur">${w.s}–${w.e}</span>
          ${n ? `<span class="pill dim">${n} task${n === 1 ? "" : "s"} fit</span>` : `<span class="pill">silent — nothing fits</span>`}
          ${dimPills(w.dims)}
        </div>
      </div><span class="chev">›</span></button>`;
  }
  function findWindow(name) {
    return dayShape(curDate()).windows.find(w => w.name === name) || dayShape(today).windows[0];
  }

  /* ====================== screens shared by variants ====================== */
  /* --- ad-hoc query adjustment: "actually, #while-out tasks are fine right now" --- */
  function qText(d, q) { return d.type === "ord" ? q[d.key] : q[d.key].join(" / "); }
  function isAdjusted(k) { return !!(S.adjust && S.adjust[k] !== undefined); }

  function adjuster(w, q) {
    const changed = !!S.adjust && Object.keys(S.adjust).length > 0;
    const baseN = TASKS.filter(t => matchesQ(t, w ? baseQuery(w) : openQuery())).length;
    const nowN = TASKS.filter(t => matchesQ(t, q)).length;
    return `<div class="adjust">
      <button class="adjust-h" data-act="adjustopen" aria-expanded="${S.adjustOpen}">
        <span class="lbl">Matching on</span>
        <span class="adjust-sum">${DIMS.map(d =>
          `<span class="pill ${isAdjusted(d.key) ? "now" : "dim"}">${esc(d.label.toLowerCase())}: ${esc(qText(d, q))}</span>`).join("")}</span>
        <span class="chev">${S.adjustOpen ? "⌃" : "⌄"}</span>
      </button>
      ${S.adjustOpen ? `<div class="adjust-body">
        ${DIMS.map(d => `<div class="lbl">${esc(d.label)}${d.type === "ord"
            ? ` <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3)">— ceiling</span>` : ""}</div>
          <div class="chipset">${d.values.map(v => `<button data-act="qtoggle" data-k="${d.key}" data-v="${esc(v)}"
            aria-pressed="${d.type === "ord" ? q[d.key] === v : q[d.key].includes(v)}">${esc(v)}${
              d.type === "cat" && v === d.winDef ? ` <span style="opacity:.6;font-size:11px">default</span>` : ""}</button>`).join("")}</div>`).join("")}
        <div class="note" style="padding:12px 0 2px">Switching a value <b>on</b> lifts its exclude and boosts it —
          the same thing the window itself does. The default is on unless you switch it off, and switching the
          <i>default</i> off is the one move that goes beyond what a window can express.</div>
      </div>` : ""}
      ${changed ? `<div class="adjust-bar">
        <span><b>${nowN}</b> fit, was ${baseN}</span>
        <button class="btn ghost" style="padding:6px 10px" data-act="qreset">Reset</button>
        <button class="btn" style="padding:6px 12px" data-act="sheet" data-kind="keep">Keep this…</button>
      </div>` : ""}
    </div>`;
  }

  function keepSheet() {
    const w = findWindow(S.param);
    const used = PATTERNS.filter(p => p.days.some(t => tpl(t).windows.some(x => x.name === w.name)));
    return `<div class="veil" data-act="closesheet"><div class="sheet" data-stop>
      <div class="grabber"></div>
      <div class="sheet-h"><h2>Keep this change?</h2>
        <button class="icon" data-act="closesheet" style="background:none;border:none;color:var(--accent)">Cancel</button></div>
      <div class="note" style="padding-top:12px">By default the adjustment is <b>for this fire only</b> — it dies
        with the reminder at end of day. Making it stick is the same fork the model already draws.</div>
      <div class="stack">
        <button class="btn wide" data-act="closesheet">Just ${esc(fmtShort(curDate()))}<br>
          <span style="font-size:12px;color:var(--ink-2);font-weight:400">Writes an override — a copied one-off day. Nothing else changes.</span></button>
        <button class="btn wide" data-act="closesheet">Every “${esc(w.name)}”<br>
          <span style="font-size:12px;color:var(--ink-2);font-weight:400">Edits the day template. Propagates to ${used.length} pattern${used.length === 1 ? "" : "s"}.</span></button>
      </div>
      <div class="note">Reality vs assumption, decided at the moment you noticed the difference — which is the
        only moment you actually know which one it was.</div>
    </div></div>`;
  }

  function landingScreen(back, backLabel) {
    const w = findWindow(S.param);
    const q = effQuery(w);
    const list = matchesForQ(q, w);
    const snoozeMin = Math.min(30, Math.max(5, Math.round(winMins(w) * .25)));
    return nav(w.name, { back, backLabel, sub:`${w.s}–${w.e} · ${fmtShort(curDate())}` }) + `
      <div class="scroll">
        <div class="note">Opened from the notification. This is where triage lives — the push itself is
          <b>a doorbell carrying one URL</b>.</div>
        ${adjuster(w, q)}
        <div class="list">${list.length ? list.map(t => taskRow(t)).join("")
          : `<div class="empty">Nothing fits.<br>No notification would have fired.</div>`}</div>
        <div class="btn-row">
          <button class="btn" data-act="snooze">Snooze ${snoozeMin} min</button>
          <button class="btn ghost" data-act="go" data-screen="${back}">Done for now</button>
        </div>
        ${footerBar()}
        <div class="note">Snooze re-matches at the new time with current task state. <b>Open question:</b> does it
          re-match on the window's own values, or on the adjustment you just made?</div>
      </div>`;
  }

  function fitsNowScreen(back, backLabel) {
    const live = liveWindow();
    const q = effQuery(live);
    const list = matchesForQ(q, live);
    return nav("Right now", { back, backLabel,
      sub:live ? `Starting from ${live.name}` : "No window open — starting wide" }) + `
      <div class="scroll">
        <div class="note">Asked for on purpose, not pushed. ${live ? `Seeded from the open window, then yours to bend.`
          : `Nothing is open, so this starts from the window-side defaults and nothing else.`}</div>
        ${adjuster(live, q)}
        <div class="list">${list.length ? list.map(t => taskRow(t)).join("")
          : `<div class="empty">Nothing fits that.<br>Try widening a dimension above.</div>`}</div>
        ${footerBar()}
        <div class="note">This is the "show me what fits now" feature the snooze rule was careful <i>not</i> to be.
          It never fires a notification and never edits a window unless you ask it to.</div>
      </div>`;
  }

  function taskDetail(back, backLabel) {
    const t = task(+S.param) || TASKS[0];
    return nav("Task", { back, backLabel }) + `
      <div class="scroll">
        <div class="stack">
          <div class="lbl">Title</div>
          <input class="field" value="${esc(t.t)}">
          <div class="lbl">Notes</div>
          <textarea class="field" rows="2" placeholder="A URL or a sentence of context">${esc(t.notes || "")}</textarea>
          <div class="lbl">Duration</div>
          <div class="chipset">${DURS.map(d =>
            `<button data-act="setdur" data-id="${t.id}" data-v="${d}" aria-pressed="${String(t.dur) === String(d)}">${durLabel(d)}</button>`).join("")}</div>
          <div class="lbl">Status</div>
          <div class="chipset">${["Unprocessed","Active","Done","Stale"].map(s =>
            `<button data-act="setst" data-id="${t.id}" data-v="${s}" aria-pressed="${t.st === s}">${s}</button>`).join("")}</div>
          <div class="lbl">Deadline</div>
          <input class="field" type="date" value="${t.due || ""}">
        </div>
        <div class="sec-h">Tags</div>
        <div class="stack" style="padding-top:4px">
          ${DIMS.map(d => `
            <div class="lbl">${esc(d.label)} <span style="text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:400">— unset means "${esc(d.taskDef)}"</span></div>
            <div class="chipset">${d.values.map(v =>
              `<button data-act="setdim" data-id="${t.id}" data-k="${d.key}" data-v="${esc(v)}"
                 aria-pressed="${(t.dims[d.key] ?? d.taskDef) === v}">${esc(v)}</button>`).join("")}</div>`).join("")}
          ${(t.tags || []).length ? `<div class="lbl">Unresolved</div><div class="chipset">
            ${t.tags.map(x => `<span class="pill inert">${esc(x)} · kept but inert</span>`).join("")}</div>` : ""}
        </div>
        <div class="btn-row"><button class="btn primary wide" data-act="go" data-screen="${back}">Save</button></div>
        <div class="note">Dimensions themselves are declared in code. This screen picks <b>values</b> on them,
          never edits the axes.</div>
      </div>`;
  }

  function dimensionsScreen(back, backLabel) {
    return nav("Dimensions", { back, backLabel, sub:"Read-only — declared in code" }) + `
      <div class="scroll">
        <div class="list">${DIMS.map(d => `<div class="row"><div class="body">
          <div class="title">${esc(d.label)}</div>
          <div class="meta"><span class="pill">${d.type === "ord" ? "ordinal" : "categorical"}</span>
            <span class="pill dim">task default: ${esc(d.taskDef)}</span>
            <span class="pill dim">window default: ${esc(d.winDef)}</span></div>
          <div class="meta">${d.values.map(v => `<span class="pill">${esc(v)}</span>`).join("")}</div>
        </div></div>`).join("")}</div>
        <div class="note">There is deliberately <b>no UI for managing dimensions</b>. Adding one is a code change.
          This screen exists so a wrong reminder can be debugged — the two defaults are otherwise invisible.</div>
      </div>`;
  }

  function triageScreen(back, backLabel) {
    const un = TASKS.filter(t => t.st === "Unprocessed");
    const st = TASKS.filter(t => t.st === "Stale");
    return nav("Process", { back, backLabel, sub:`${un.length} unprocessed · ${st.length} stale` }) + `
      <div class="scroll">
        <div class="sec-h">Missing a duration</div>
        <div class="list">${un.map(t => `<div class="row"><div class="body">
          <div class="title">${esc(t.t)}</div>
          <div class="meta chipset" style="margin-top:7px">${DURS.map(d =>
            `<button data-act="process" data-id="${t.id}" data-v="${d}"
               style="background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);padding:6px 11px;border-radius:99px;font-size:13px">${durLabel(d)}</button>`).join("")}</div>
        </div></div>`).join("") || `<div class="empty">Nothing to process.</div>`}</div>
        <div class="sec-h">Stale — reword, slice smaller, or delete</div>
        <div class="list">${st.map(t => taskRow(t)).join("")}</div>
        <div class="note">These two piles only ever nudge through the <b>reminder footer</b>. Neither gets a
          notification of its own.</div>
      </div>`;
  }

  function eventOverlapSheet() {
    return `<div class="veil" data-act="closesheet"><div class="sheet" data-stop>
      <div class="grabber"></div>
      <div class="sheet-h"><h2>This clashes with a window</h2></div>
      <div class="note" style="padding-top:12px">
        <b>Band concert, 19:00–20:30</b> overlaps <b>Evening prep, 18:00–20:00</b> on ${esc(fmtShort(dAdd(2)))}.
        A date has one shape, so choose what happens to the window.</div>
      <div class="stack">
        <button class="btn wide" data-act="overlap" data-v="replace">Replace the window<br>
          <span style="font-size:12px;color:var(--ink-2);font-weight:400">Evening prep disappears that day</span></button>
        <button class="btn wide" data-act="overlap" data-v="truncate">Truncate it to 18:00–19:00<br>
          <span style="font-size:12px;color:var(--ink-2);font-weight:400">Fire time unchanged</span></button>
        <button class="btn wide" data-act="overlap" data-v="split">Split it around the event<br>
          <span style="font-size:12px;color:var(--ink-2);font-weight:400">18:00–19:00 and 20:30–20:00 → second half dropped</span></button>
      </div>
      <div class="note">Whichever you pick, ${esc(fmtShort(dAdd(2)))} becomes a <b>one-off day</b>.
        One action, one question, two artifacts.</div>
    </div></div>`;
  }

  function captureSheet() {
    return `<div class="veil" data-act="closesheet"><div class="sheet" data-stop>
      <div class="grabber"></div>
      <div class="sheet-h"><h2>Quick add</h2>
        <button class="icon" data-act="closesheet" style="background:none;border:none;color:var(--accent)">Cancel</button></div>
      <div class="stack">
        <input class="field" placeholder="What is it?" autofocus>
        <div class="lbl">How long? — the one thing capture must ask</div>
        <div class="chipset">${DURS.map(d => `<button data-act="capture" data-v="${d}">${durLabel(d)}</button>`).join("")}</div>
        <button class="btn ghost wide" data-act="closesheet">Add more details…</button>
      </div>
      <div class="note">Mirrors the <b>Quick add</b> Shortcut exactly — same endpoint, same two interactions,
        lands <b>Active</b>. The details path just sends more fields.</div>
    </div></div>`;
  }

  function patternSheet() {
    return `<div class="veil" data-act="closesheet"><div class="sheet" data-stop>
      <div class="grabber"></div>
      <div class="sheet-h"><h2>Switch pattern</h2>
        <button class="icon" data-act="closesheet" style="background:none;border:none;color:var(--accent)">Done</button></div>
      <div class="list">${PATTERNS.map(p => `<button class="row" data-act="setpattern" data-v="${p.id}">
        <div class="body"><div class="title">${esc(p.name)}${p.id === activePattern ? " · active" : ""}</div>
        <div class="meta">${p.days.map((t, i) => `<span class="pill">${WD[i]} ${esc(tpl(t).name.split(" ")[0])}</span>`).join("")}</div></div>
        <span class="chev">${p.id === activePattern ? "✓" : "›"}</span></button>`).join("")}</div>
      <div class="note">Seasons come back round, so previous patterns are <b>kept and named</b>, never rebuilt.
        Switching is one tap and changes every undated future day at once.</div>
    </div></div>`;
  }

  /* ============================ variant A ============================ */
  const TABS_A = [
    { k:"home", g:"☑", l:"Tasks" }, { k:"today", g:"◷", l:"Today" },
    { k:"schedule", g:"▤", l:"Schedule" }, { k:"more", g:"⋯", l:"More" },
  ];
  const TABS_B = [
    { k:"home", g:"◷", l:"Day" }, { k:"tasks", g:"☑", l:"Tasks" },
    { k:"templates", g:"▤", l:"Shapes" }, { k:"more", g:"⋯", l:"More" },
  ];
  const TABS_D = [
    { k:"home", g:"◷", l:"Now" }, { k:"tasks", g:"☑", l:"Tasks" },
    { k:"schedule", g:"▤", l:"Schedule" }, { k:"more", g:"⋯", l:"More" },
  ];
  const TABS = { A:TABS_A, B:TABS_B, D:TABS_D };
  const A = {
    name:"Task-first",
    tagline:"A conventional bottom tab bar. The task list is home; the schedule is a settings-like drill-down you visit rarely.",
    screens:{
      home() {
        const list = TASKS.filter(t => t.st === S.filter);
        return nav("Tasks", { right:`<button class="icon" data-act="sheet" data-kind="capture">＋</button>` }) + `
          <div class="filterbar">${["Active","Unprocessed","Stale","Done"].map(f =>
            `<button data-act="filter" data-v="${f}" aria-pressed="${S.filter === f}">${f} ${TASKS.filter(t => t.st === f).length}</button>`).join("")}</div>
          <div class="scroll">
            <div class="list">${list.map(t => taskRow(t)).join("") || `<div class="empty">Nothing here.</div>`}</div>
            <div class="note">Marking off happens <b>here</b>, deliberately — never as a side effect of dismissing
              a reminder.</div>
          </div>
          <button class="fab" data-act="sheet" data-kind="capture" aria-label="Quick add">＋</button>` + tabbar(TABS_A, "home");
      },
      today() {
        const sh = dayShape(today), live = liveWindow();
        return nav("Today", { sub:`${fmtDate(today)} · ${sh.label}` }) + `
          <div class="scroll">
            ${live ? `<div class="sec"><button class="btn primary wide" data-act="landing" data-win="${esc(live.name)}">
              ${esc(live.name)} is open now — ${matchesFor(live).length} fit</button></div>` : ""}
            <div class="sec-h">Windows today</div>
            <div class="list">${sh.windows.map(w => windowLine(w)).join("")}</div>
            ${eventsOn(today).length ? `<div class="sec-h">Events</div><div class="list">
              ${eventsOn(today).map(e => `<div class="row"><div class="body"><div class="title">${esc(e.name)}</div>
                <div class="meta"><span class="pill dur">${e.s}–${e.e}</span>${dimPills(e.dims)}</div></div></div>`).join("")}</div>` : ""}
            <div class="sec"><button class="btn wide" data-act="go" data-screen="fitsnow">What fits right now?</button></div>
            ${footerBar()}
          </div>` + tabbar(TABS_A, "today");
      },
      schedule() {
        const p = pattern();
        return nav("Schedule") + `
          <div class="scroll">
            <div class="sec-h">Active pattern</div>
            <div class="list"><button class="row" data-act="sheet" data-kind="pattern">
              <div class="body"><div class="title">${esc(p.name)}</div>
              <div class="meta"><span class="pill">${PATTERNS.length} saved patterns</span></div></div><span class="chev">›</span></button></div>
            <div class="sec-h">The week</div>
            <div class="list">${p.days.map((tid, i) => `<button class="row" data-act="go" data-screen="template" data-param="${tid}">
              <div class="body"><div class="title">${WDL[i]}</div>
              <div class="meta"><span class="pill dim">${esc(tpl(tid).name)}</span>
                <span class="pill">${tpl(tid).windows.length} windows</span></div></div><span class="chev">›</span></button>`).join("")}</div>
            <div class="sec-h">Dated exceptions</div>
            <div class="list">
              <button class="row" data-act="go" data-screen="dates"><div class="body">
                <div class="title">Overrides &amp; events</div>
                <div class="meta"><span class="pill">${OVERRIDES.length} overrides</span><span class="pill">${EVENTS.length} events</span></div>
              </div><span class="chev">›</span></button>
            </div>
            <div class="note">Three levels deep before you reach a window's tags: <b>pattern → day template →
              window</b>. Cheap to build, but the thing you edit most often is the furthest away.</div>
          </div>` + tabbar(TABS_A, "schedule");
      },
      template() {
        const t = tpl(S.param) || TEMPLATES[0];
        const used = PATTERNS.filter(p => p.days.includes(t.id));
        return nav(t.name, { back:"schedule", backLabel:"Schedule" }) + `
          <div class="scroll">
            <div class="sec-h">Windows</div>
            <div class="list">${t.windows.map(w => `<button class="row" data-act="go" data-screen="window" data-param="${esc(t.id)}|${esc(w.name)}">
              <div class="body"><div class="title">${esc(w.name)}</div>
              <div class="meta"><span class="pill dur">${w.s}–${w.e}</span>${dimPills(w.dims)}</div></div><span class="chev">›</span></button>`).join("")}
              <button class="row" data-act="noop"><div class="body"><div class="title" style="color:var(--accent)">＋ Add a window</div></div></button></div>
            ${t.protos.length ? `<div class="sec-h">Event prototypes</div><div class="list">
              ${t.protos.map(e => `<div class="row"><div class="body"><div class="title">${esc(e.name)}</div>
              <div class="meta"><span class="pill dur">${e.s}–${e.e}</span><span class="pill">dateless</span></div></div></div>`).join("")}</div>` : ""}
            <div class="sec-h">Used by</div>
            <div class="list">${used.map(p => `<div class="row"><div class="body"><div class="title">${esc(p.name)}</div>
              <div class="meta">${p.days.map((x, i) => x === t.id ? `<span class="pill dim">${WD[i]}</span>` : "").join("")}</div></div></div>`).join("")}</div>
            <div class="btn-row"><button class="btn" data-act="noop">Clone to diverge</button>
              <button class="btn primary" data-act="noop">Save</button></div>
            <div class="note">Editing this propagates to <b>every pattern above</b>. Blast radius is made visible,
              not prevented.</div>
          </div>`;
      },
      window() {
        const [tid, wname] = String(S.param).split("|");
        const t = tpl(tid) || TEMPLATES[0];
        const w = t.windows.find(x => x.name === wname) || t.windows[0];
        return nav(w.name, { back:"template", backParam:t.id, backLabel:t.name.split(" ")[0] }) + `
          <div class="scroll">
            <div class="stack">
              <div class="lbl">Name — becomes the reminder's copy</div>
              <input class="field" value="${esc(w.name)}">
              <div class="lbl">Span</div>
              <div style="display:flex;gap:9px"><input class="field" type="time" value="${w.s}">
                <input class="field" type="time" value="${w.e}"></div>
              <div class="note" style="padding:2px 0 0">Fires at <b>${w.s}</b>. ${winMins(w)} minutes long, so
                snooze is ${Math.min(30, Math.max(5, Math.round(winMins(w) * .25)))} min.</div>
            </div>
            <div class="sec-h">What can be done here</div>
            <div class="stack" style="padding-top:4px">
              ${DIMS.map(d => `<div class="lbl">${esc(d.label)}
                <span style="text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:400">— unset means "${esc(d.winDef)}"</span></div>
                <div class="chipset">${d.values.map(v => `<button data-act="setwdim" data-t="${t.id}" data-w="${esc(w.name)}" data-k="${d.key}" data-v="${esc(v)}"
                  aria-pressed="${(w.dims[d.key] ?? d.winDef) === v}">${esc(v)}</button>`).join("")}</div>`).join("")}
            </div>
            <div class="sec-h">Right now this would surface</div>
            <div class="list">${matchesFor(w).slice(0, 4).map(t2 => taskRow(t2, { dims:false })).join("")
              || `<div class="empty">Nothing — so it would stay silent.</div>`}</div>
            <div class="note">Live preview is the only defence against a mis-set default: the two-sided
              comparison is otherwise invisible until a reminder is wrong.</div>
          </div>`;
      },
      dates() {
        return nav("Overrides & events", { back:"schedule", backLabel:"Schedule" }) + `
          <div class="scroll">
            <div class="sec-h">Dates that differ from the pattern</div>
            <div class="list">${OVERRIDES.map(o => `<button class="row" data-act="noop"><div class="body">
              <div class="title">${esc(fmtShort(new Date(o.date + "T00:00:00")))}</div>
              <div class="meta"><span class="pill dim">${esc(o.label)}</span>
                <span class="pill">${o.from ? "stamped copy" : "one-off day"}</span></div></div><span class="chev">›</span></button>`).join("")}</div>
            <div class="sec-h">Events</div>
            <div class="list">
              <button class="row" data-act="sheet" data-kind="overlap"><div class="body">
                <div class="title" style="color:var(--accent)">＋ New event</div></div></button>
              ${EVENTS.map(e => `<button class="row" data-act="noop"><div class="body">
              <div class="title">${esc(e.name)}</div>
              <div class="meta"><span class="pill dur">${esc(fmtShort(new Date(e.date + "T00:00:00")))} ${e.s}</span>${dimPills(e.dims)}</div>
            </div><span class="chev">›</span></button>`).join("")}</div>
            <div class="note">"College kid home for the weekend" is <b>two dated overrides</b> made in one gesture —
              there is no multi-day object, so per-day variation is free and conflicts can't be represented.</div>
          </div>`;
      },
      more() {
        return nav("More") + `
          <div class="scroll">
            <div class="list">
              <button class="row" data-act="go" data-screen="triage"><div class="body"><div class="title">Process &amp; stale</div>
                <div class="meta"><span class="pill">${countBy("Unprocessed")} + ${countBy("Stale")}</span></div></div><span class="chev">›</span></button>
              <button class="row" data-act="go" data-screen="dimensions"><div class="body"><div class="title">Dimensions</div>
                <div class="meta"><span class="pill">read-only</span></div></div><span class="chev">›</span></button>
              <button class="row" data-act="noop"><div class="body"><div class="title">Pushover</div>
                <div class="meta"><span class="pill">app + user key</span></div></div><span class="chev">›</span></button>
              <button class="row" data-act="noop"><div class="body"><div class="title">Logs</div></div><span class="chev">›</span></button>
            </div>
          </div>` + tabbar(TABS_A, "more");
      },
      landing:() => landingScreen("today", "Today"),
      fitsnow:() => fitsNowScreen("today", "Today"),
      task:() => taskDetail("home", "Tasks"),
      dimensions:() => dimensionsScreen("more", "More"),
      triage:() => triageScreen("more", "More"),
    },
  };

  /* ============================ variant B ============================ */
  const B = {
    name:"Day-first",
    tagline:"The day is the home screen. You edit the schedule by editing the day in front of you; templates and patterns are derived from what you've drawn.",
    screens:{
      home() {
        const d = curDate(), sh = dayShape(d), evs = eventsOn(d);
        const isToday = iso(d) === iso(today);
        const H0 = 6, H1 = 23, PX = 34;
        const y = m => (m - H0 * 60) / 60 * PX;
        const hrs = [];
        for (let h = H0; h <= H1; h++) hrs.push(`<div class="hr"><span>${String(h).padStart(2,"0")}</span></div>`);
        const blocks = sh.windows.map(w => {
          const live = isToday && liveWindow() && liveWindow().name === w.name;
          const n = matchesFor(w).length;
          return `<button class="blk ${live ? "live" : ""}" style="top:${y(mins(w.s)) + 12}px;height:${Math.max(30, (winMins(w) / 60) * PX - 4)}px"
            data-act="sheet" data-kind="win" data-param="${esc(w.name)}">
            <div class="bt">${esc(w.name)}</div>
            <div class="bm">${w.s}–${w.e} · ${n ? n + " fit" : "silent"}</div></button>`;
        }).join("");
        const evBlocks = evs.map(e => `<div class="blk event" style="top:${y(mins(e.s)) + 12}px;height:${Math.max(28, ((mins(e.e) - mins(e.s)) / 60) * PX - 4)}px">
          <div class="bt">${esc(e.name)}</div><div class="bm">${e.s}–${e.e} · event</div></div>`).join("");
        const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
        const days = [];
        for (let i = -1; i < 8; i++) {
          const dd = dAdd(i);
          const has = OVERRIDES.some(o => o.date === iso(dd)) || eventsOn(dd).length;
          days.push(`<button data-act="setdate" data-v="${iso(dd)}" ${iso(dd) === S.date ? 'aria-current="date"' : ""}>
            <div class="wd">${WD[dd.getDay()]}</div><div class="dn">${dd.getDate()}</div>
            ${has ? '<div class="dot"></div>' : '<div style="height:7px"></div>'}</button>`);
        }
        return nav(fmtDate(d), { sub:`${sh.source === "override" ? "Override · " : ""}${sh.label}`,
          right:`<button class="icon" data-act="sheet" data-kind="capture">＋</button>` }) + `
          <div class="weekstrip">${days.join("")}</div>
          <div class="scroll">
            <div class="timeline">
              ${hrs.join("")}${blocks}${evBlocks}
              ${isToday && nowMin > H0 * 60 && nowMin < H1 * 60 ? `<div class="nowline" style="top:${y(nowMin) + 12}px"></div>` : ""}
            </div>
            <div class="btn-row">
              <button class="btn" data-act="noop">＋ Window</button>
              <button class="btn" data-act="sheet" data-kind="overlap">＋ Event</button>
            </div>
            <div class="note">Editing a block on a <b>future date</b> writes an override for that date only — the
              pattern behind it is never touched. Editing today does the same. That's the whole model, visible.</div>
            ${footerBar()}
          </div>` + tabbar(TABS_B, "home");
      },
      tasks() {
        const list = TASKS.filter(t => t.st === S.filter);
        return nav("Tasks", { sub:"The pool the day draws from" }) + `
          <div class="filterbar">${["Active","Unprocessed","Stale","Done"].map(f =>
            `<button data-act="filter" data-v="${f}" aria-pressed="${S.filter === f}">${f} ${TASKS.filter(t => t.st === f).length}</button>`).join("")}</div>
          <div class="scroll"><div class="list">${list.map(t => taskRow(t)).join("")}</div>
          <div class="note">A flat pool on purpose — there is no list order to groom. Ranking only happens
            when a window asks.</div></div>` + tabbar(TABS_B, "tasks");
      },
      templates() {
        return nav("Day shapes", { sub:`${pattern().name}`,
          right:`<button class="icon" data-act="sheet" data-kind="pattern">Switch</button>` }) + `
          <div class="scroll">
            <div class="sec-h">This week uses</div>
            <div class="list">${pattern().days.map((tid, i) => `<button class="row" data-act="go" data-screen="template" data-param="${tid}">
              <div class="body"><div class="title">${WDL[i]} — ${esc(tpl(tid).name)}</div>
              <div class="meta">${tpl(tid).windows.map(w => `<span class="pill dur">${w.s}</span>`).join("")}</div></div>
              <span class="chev">›</span></button>`).join("")}</div>
            <div class="sec-h">All shapes</div>
            <div class="list">${TEMPLATES.map(t => `<button class="row" data-act="go" data-screen="template" data-param="${t.id}">
              <div class="body"><div class="title">${esc(t.name)}</div>
              <div class="meta"><span class="pill">${t.windows.length} windows</span>
                <span class="pill">used by ${PATTERNS.filter(p => p.days.includes(t.id)).length}</span>
                ${t.protos.length ? `<span class="pill dim">${t.protos.length} event prototype</span>` : ""}</div></div>
              <span class="chev">›</span></button>`).join("")}</div>
            <div class="note">Reached <b>after</b> you've drawn a day, not before. The intended path to a new shape is
              "make today look right, then <b>promote it</b>".</div>
          </div>` + tabbar(TABS_B, "templates");
      },
      template:() => A.screens.template(),
      window:() => A.screens.window(),
      more() {
        return nav("More") + `
          <div class="scroll"><div class="list">
            <button class="row" data-act="go" data-screen="triage"><div class="body"><div class="title">Process &amp; stale</div>
              <div class="meta"><span class="pill">${countBy("Unprocessed")} + ${countBy("Stale")}</span></div></div><span class="chev">›</span></button>
            <button class="row" data-act="go" data-screen="dates"><div class="body"><div class="title">Overrides &amp; events</div></div><span class="chev">›</span></button>
            <button class="row" data-act="go" data-screen="dimensions"><div class="body"><div class="title">Dimensions</div></div><span class="chev">›</span></button>
            <button class="row" data-act="noop"><div class="body"><div class="title">Pushover</div></div><span class="chev">›</span></button>
          </div></div>` + tabbar(TABS_B, "more");
      },
      dates:() => A.screens.dates(),
      landing:() => landingScreen("home", "Day"),
      fitsnow:() => fitsNowScreen("home", "Day"),
      task:() => taskDetail("tasks", "Tasks"),
      dimensions:() => dimensionsScreen("more", "More"),
      triage:() => triageScreen("more", "More"),
    },
  };

  /* ============================ variant C ============================ */
  const C = {
    name:"Moment-first",
    tagline:"No tab bar at all. One screen answers \"what now?\"; capture is always on the bottom edge; everything else lives behind a single overflow index.",
    screens:{
      home() {
        const live = liveWindow(), next = nextWindow();
        const w = live || next || dayShape(today).windows[0];
        const list = live ? matchesFor(live) : [];
        return `<button class="overflow-btn" data-act="go" data-screen="index" aria-label="Everything else">⋯</button>
          <div class="scroll" style="padding-bottom:70px">
            <div class="moment">
              <div class="eyebrow">${live ? "Open now" : "Nothing open"}</div>
              <h1>${esc(live ? live.name : next ? "Next: " + next.name : "Done for today")}</h1>
              <div class="when">${live ? `${live.s}–${live.e} · ${list.length} of ${countBy("Active")} tasks fit`
                : next ? `starts ${next.s}` : "no more windows today"}</div>
            </div>
            ${live ? `<div class="stream">${list.map(t => `<button class="streamitem" data-act="task" data-id="${t.id}">
                <span class="tick" data-done="0">✓</span>
                <span style="flex:1"><span style="display:block;font-size:15.5px;letter-spacing:-.01em">${esc(t.t)}</span>
                <span class="meta" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px">
                  <span class="pill dur">${durLabel(t.dur)}</span>${duePill(t)}${dimPills(t.dims)}</span></span>
              </button>`).join("")}</div>
              <div class="btn-row"><button class="btn" data-act="snooze">Snooze ${Math.min(30, Math.max(5, Math.round(winMins(live) * .25)))} min</button>
                <button class="btn ghost" data-act="noop">Not now</button></div>`
            : `<div class="empty">Silence is truthful — nothing is open, so nothing is being asked of you.<br><br>
                <button class="btn" data-act="go" data-screen="fitsnow">Show me what would fit anyway</button></div>`}
            ${footerBar()}
            <div class="note">The notification opens <b>exactly this screen</b>. There is no separate landing page,
              because the landing page and the home screen are the same question.</div>
          </div>
          <div class="capbar">
            <input class="field" placeholder="Add a task…" data-act="capfocus">
            <button class="btn primary" data-act="sheet" data-kind="capture">Add</button>
          </div>`;
      },
      index() {
        const items = [
          { k:"all",     g:"☑", t:"All tasks",    d:`${countBy("Active")} active` },
          { k:"triage",  g:"◐", t:"Process",      d:`${countBy("Unprocessed")} to process · ${countBy("Stale")} stale` },
          { k:"week",    g:"▤", t:"The week",     d:pattern().name },
          { k:"dates",   g:"◈", t:"Dates",        d:`${OVERRIDES.length} overrides · ${EVENTS.length} events` },
          { k:"dimensions", g:"⊞", t:"Dimensions", d:"read-only, code-declared" },
          { k:"noop",    g:"◎", t:"Pushover",     d:"app + user key" },
        ];
        return nav("Everything else", { back:"home", backLabel:"Now" }) + `
          <div class="scroll"><div class="indexgrid">
            ${items.map(i => `<button data-act="go" data-screen="${i.k}">
              <span class="g">${i.g}</span><span class="t">${esc(i.t)}</span><span class="d">${esc(i.d)}</span></button>`).join("")}
          </div>
          <div class="note">Six destinations, one level deep, visited rarely. The cost of no tab bar is that
            nothing here is ever one tap away.</div></div>`;
      },
      all() {
        const list = TASKS.filter(t => t.st === S.filter);
        return nav("All tasks", { back:"index", backLabel:"Index" }) + `
          <div class="filterbar">${["Active","Unprocessed","Stale","Done"].map(f =>
            `<button data-act="filter" data-v="${f}" aria-pressed="${S.filter === f}">${f} ${TASKS.filter(t => t.st === f).length}</button>`).join("")}</div>
          <div class="scroll"><div class="list">${list.map(t => taskRow(t)).join("")}</div></div>`;
      },
      week() {
        const p = pattern();
        return nav("The week", { back:"index", backLabel:"Index",
          right:`<button class="icon" data-act="sheet" data-kind="pattern">${esc(p.name)}</button>` }) + `
          <div class="scroll"><div class="weekform">
            ${p.days.map((tid, i) => { const t = tpl(tid); return `<details ${i === new Date().getDay() ? "open" : ""}>
              <summary><span class="day">${WD[i]}</span><span class="tpl">${esc(t.name)}</span><span class="chev">⌄</span></summary>
              <div class="inner">
                ${t.windows.map(w => `<button class="row" style="padding:9px 0;border:none;border-bottom:1px solid var(--line-soft)"
                    data-act="go" data-screen="window" data-param="${esc(t.id)}|${esc(w.name)}">
                  <div class="body"><div class="title" style="font-size:14px">${esc(w.name)}</div>
                  <div class="meta"><span class="pill dur">${w.s}–${w.e}</span>${dimPills(w.dims)}</div></div>
                  <span class="chev">›</span></button>`).join("")}
                <button class="btn ghost" style="padding:9px 0" data-act="noop">＋ Add a window to ${esc(t.name)}</button>
              </div></details>`; }).join("")}
          </div>
          <div class="note">One scrolling form, no drill-down: the whole week is on one screen and every window is
            two taps from its tags. The catch — it edits <b>templates</b>, so the propagation warning has nowhere
            obvious to live.</div>
          <div class="btn-row"><button class="btn wide" data-act="go" data-screen="dates">Change a single date instead →</button></div>
          </div>`;
      },
      dates:() => A.screens.dates(),
      window:() => A.screens.window(),
      landing:() => landingScreen("home", "Now"),
      fitsnow:() => fitsNowScreen("home", "Now"),
      task:() => taskDetail("all", "All tasks"),
      dimensions:() => dimensionsScreen("index", "Index"),
      triage:() => triageScreen("index", "Index"),
    },
  };

  /* ====================== variant D — C, merged per feedback ====================== */
  const D = {
    name:"Moment-first, merged",
    tagline:"C's calm, A's Today layout, and a tab bar back at the bottom. Adds ad-hoc query adjustment to both "
      + "the reminder landing page and \"Right now\" — the thing none of the first three could do.",
    screens:{
      home() {
        const sh = dayShape(today), live = liveWindow(), evs = eventsOn(today);
        return nav("Today", { sub:`${fmtDate(today)} · ${sh.label}` }) + `
          <div class="scroll col">
            ${live ? `<button class="livecard" data-act="landing" data-win="${esc(live.name)}">
              <div class="eyebrow">Open now</div>
              <div class="t">${esc(live.name)}</div>
              <div class="m">${live.s}–${live.e} · ${matchesFor(live).length} of ${countBy("Active")} tasks fit</div>
            </button>` : ""}
            <div class="sec-h">Windows today</div>
            <div class="list">${sh.windows.map(w => windowLine(w)).join("")}</div>
            ${evs.length ? `<div class="sec-h">Events</div><div class="list">
              ${evs.map(e => `<div class="row"><div class="body"><div class="title">${esc(e.name)}</div>
                <div class="meta"><span class="pill dur">${e.s}–${e.e}</span>${dimPills(e.dims)}</div></div></div>`).join("")}</div>` : ""}
            <div class="fitspace">
              <button class="btn fits" data-act="go" data-screen="fitsnow">What fits right now?</button>
            </div>
            ${footerBar()}
          </div>` + tabbar(null, "home");
      },
      tasks() {
        const list = TASKS.filter(t => t.st === S.filter);
        return nav("Tasks") + `
          <div class="filterbar">${["Active","Unprocessed","Stale","Done"].map(f =>
            `<button data-act="filter" data-v="${f}" aria-pressed="${S.filter === f}">${f} ${TASKS.filter(t => t.st === f).length}</button>`).join("")}</div>
          <div class="scroll">
            <div class="list">${list.map(t => taskRow(t)).join("") || `<div class="empty">Nothing here.</div>`}</div>
            <div class="note">Marking off happens <b>here</b>, deliberately — never as a side effect of dismissing
              a reminder.</div>
          </div>` + tabbar(null, "tasks");
      },
      schedule:() => A.screens.schedule(),
      template:() => A.screens.template(),
      window:() => A.screens.window(),
      dates:() => A.screens.dates(),
      more:() => A.screens.more(),
      landing:() => landingScreen("home", "Today"),
      fitsnow:() => fitsNowScreen("home", "Today"),
      task:() => taskDetail("tasks", "Tasks"),
      dimensions:() => dimensionsScreen("more", "More"),
      triage:() => triageScreen("more", "More"),
    },
  };

  const VARIANTS = { D, A, B, C };
  const KEYS = ["D","A","B","C"];

  /* ============================== render ============================== */
  function render() {
    const V = VARIANTS[S.variant] || A;
    const fn = V.screens[S.screen] || V.screens.home;
    let html = fn();
    if (S.sheet) {
      if (S.sheet.kind === "capture") html += captureSheet();
      else if (S.sheet.kind === "pattern") html += patternSheet();
      else if (S.sheet.kind === "overlap") html += eventOverlapSheet();
      else if (S.sheet.kind === "win") html += winSheet(S.sheet.param);
      else if (S.sheet.kind === "keep") html += keepSheet();
    }
    document.getElementById("device").innerHTML = html;

    document.getElementById("switcher").innerHTML = `
      <button data-sw="prev" aria-label="Previous variant">‹</button>
      <button class="label" data-sw="about">
        <b>${S.variant}</b> — ${esc(V.name)} <span class="hint">· tap for notes</span>
      </button>
      <button data-sw="next" aria-label="Next variant">›</button>`;

    const old = document.querySelector(".about");
    if (old) old.remove();
    if (S.about) {
      const el = document.createElement("div");
      el.className = "about";
      el.innerHTML = `<div class="about-in" data-stop>
        <div class="kicker">Variant ${S.variant} of ${KEYS.length} · prototype scaffolding</div>
        <h2>${esc(V.name)}</h2>
        <p>${esc(V.tagline)}</p>
        <div class="kicker" style="margin-top:14px">Screens in this variant</div>
        <ul>${Object.keys(V.screens).map(k => `<li><b>${esc(k)}</b></li>`).join("")}</ul>
        <div class="kicker" style="margin-top:14px">How to drive it</div>
        <ul>
          <li>Arrows or <code>←</code>/<code>→</code> swap variant; <code>?variant=${S.variant}</code> is in the URL.</li>
          <li>Ticks, duration chips, dimension chips and pattern switching all really mutate the in-memory state —
            matching re-runs, so counts move.</li>
          <li>Data is shared across all three variants, so like-for-like comparison holds.</li>
        </ul>
        <div style="display:flex;justify-content:flex-end;margin-top:16px">
          <button class="btn primary" data-sw="close">Close</button></div>
      </div>`;
      document.body.appendChild(el);
    }
  }

  function winSheet(name) {
    const w = findWindow(name);
    return `<div class="veil" data-act="closesheet"><div class="sheet" data-stop>
      <div class="grabber"></div>
      <div class="sheet-h"><h2>${esc(w.name)}</h2>
        <button class="icon" data-act="landing" data-win="${esc(w.name)}" style="background:none;border:none;color:var(--accent)">Preview</button></div>
      <div class="stack">
        <div class="lbl">Span on ${esc(fmtShort(curDate()))}</div>
        <div style="display:flex;gap:9px"><input class="field" type="time" value="${w.s}"><input class="field" type="time" value="${w.e}"></div>
        ${DIMS.map(d => `<div class="lbl">${esc(d.label)}</div>
          <div class="chipset">${d.values.map(v => `<button data-act="setwdim" data-t="" data-w="${esc(w.name)}" data-k="${d.key}" data-v="${esc(v)}"
            aria-pressed="${(w.dims[d.key] ?? d.winDef) === v}">${esc(v)}</button>`).join("")}</div>`).join("")}
      </div>
      <div class="note"><b>${matchesFor(w).length}</b> tasks fit as configured.
        Saving this on a future date writes an override for that date alone.</div>
      <div class="btn-row"><button class="btn" data-act="noop">Promote day to a template</button>
        <button class="btn primary" data-act="closesheet">Save</button></div>
    </div></div>`;
  }

  /* ============================== events ============================== */
  document.addEventListener("click", e => {
    const sw = e.target.closest("[data-sw]");
    if (sw) {
      const k = sw.dataset.sw;
      if (k === "about") { S.about = !S.about; render(); return; }
      if (k === "close") { S.about = false; render(); return; }
      cycle(k === "next" ? 1 : -1);
      return;
    }
    if (e.target.closest(".about") && !e.target.closest("[data-stop]")) { S.about = false; render(); return; }

    const el = e.target.closest("[data-act]");
    if (!el) return;
    const a = el.dataset.act;
    // clicking the veil closes; clicking inside the sheet must not
    if (a === "closesheet" && el.classList.contains("veil") && e.target.closest("[data-stop]")) return;

    switch (a) {
      case "go": go(el.dataset.screen, el.dataset.param || null); break;
      case "task": go("task", el.dataset.id); break;
      case "landing": S.sheet = null; go("landing", el.dataset.win); break;
      case "sheet": sheet(el.dataset.kind, el.dataset.param); break;
      case "closesheet": sheet(null); break;
      case "filter": S.filter = el.dataset.v; render(); break;
      case "adjustopen": S.adjustOpen = !S.adjustOpen; render(); break;
      case "qreset": S.adjust = null; render(); break;
      case "qtoggle": {
        const k = el.dataset.k, v = el.dataset.v, d = dim(k);
        const w = S.screen === "fitsnow" ? liveWindow() : findWindow(S.param);
        const q = effQuery(w), base = w ? baseQuery(w) : openQuery();
        S.adjust = S.adjust || {};
        if (d.type === "ord") {
          S.adjust[k] = v;
        } else {
          const set = q[k].slice(), i = set.indexOf(v);
          if (i >= 0) set.splice(i, 1); else set.push(v);
          S.adjust[k] = set;
        }
        // back to the window's own value? then it isn't an adjustment any more
        const same = d.type === "ord"
          ? S.adjust[k] === base[k]
          : S.adjust[k].length === base[k].length && S.adjust[k].every(x => base[k].includes(x));
        if (same) delete S.adjust[k];
        if (!Object.keys(S.adjust).length) S.adjust = null;
        render(); break;
      }
      case "setdate": S.date = el.dataset.v; render(); break;
      case "toggle": { const t = task(+el.dataset.id); t.st = t.st === "Done" ? "Active" : "Done"; render(); break; }
      case "setdur": { const t = task(+el.dataset.id); const v = el.dataset.v; t.dur = v === "Longer" ? "Longer" : +v; render(); break; }
      case "setst": { task(+el.dataset.id).st = el.dataset.v; render(); break; }
      case "setdim": {
        const t = task(+el.dataset.id), k = el.dataset.k, v = el.dataset.v;
        if (t.dims[k] === v) delete t.dims[k]; else t.dims[k] = v;
        render(); break;
      }
      case "setwdim": {
        const w = el.dataset.t ? tpl(el.dataset.t).windows.find(x => x.name === el.dataset.w) : findWindow(el.dataset.w);
        const k = el.dataset.k, v = el.dataset.v;
        if (w.dims[k] === v) delete w.dims[k]; else w.dims[k] = v;
        render(); break;
      }
      case "process": { const t = task(+el.dataset.id); const v = el.dataset.v; t.dur = v === "Longer" ? "Longer" : +v; t.st = "Active"; render(); break; }
      case "capture": {
        const inp = document.querySelector(".sheet input.field");
        const title = (inp && inp.value.trim()) || "New task";
        const v = el.dataset.v;
        TASKS.unshift({ id:Date.now(), t:title, dur:v === "Longer" ? "Longer" : +v, st:"Active", dims:{} });
        sheet(null); break;
      }
      case "setpattern": { activePattern = el.dataset.v; sheet(null); break; }
      case "overlap": { sheet(null); break; }
      case "snooze": { go("home"); break; }
      case "capfocus": break;
      default: break;
    }
  });

  function cycle(dir) {
    const i = KEYS.indexOf(S.variant);
    S.variant = KEYS[(i + dir + KEYS.length) % KEYS.length];
    S.screen = "home"; S.param = null; S.sheet = null;
    const u = new URL(location.href);
    u.searchParams.set("variant", S.variant);
    history.replaceState(null, "", u);
    render();
  }

  document.addEventListener("keydown", e => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (e.key === "ArrowLeft") cycle(-1);
    else if (e.key === "ArrowRight") cycle(1);
    else if (e.key === "Escape" && (S.sheet || S.about)) { S.sheet = null; S.about = false; render(); }
  });

  render();
})();
</script>
