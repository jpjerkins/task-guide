      const days = []; for (let i = -1; i < 10; i++) { const dd = dAdd(i);
        days.push(`<button data-act="pickdate" data-v="${iso(dd)}" ${iso(dd) === S.date ? 'aria-current="date"' : ""}>
          <div class="wd">${WD[dd.getDay()]}</div><div class="dn">${dd.getDate()}</div>
          <div class="dot ${overrideOn(iso(dd)) || eventsOn(dd).length ? "" : "blank"}"></div></button>`); }
      return head + `<div class="weekstrip">${days.join("")}</div>
        <div class="scroll">
          ${scopeBanner(`date:${S.date}:x`, false)}
          <div class="sec-h">Windows on ${esc(fmtShort(d))}</div>
          <div class="list">${sh.windows.map(w => { const ref = `date:${S.date}:${w.id}`;
            return `<button class="row" data-act="expand" data-v="${ref}"><div class="body">
              <div class="title">${esc(w.name)}</div><div class="meta"><span class="pill dur">${hm(w.s)}–${hm(w.e)}</span>
              <span class="pill dim">${matchesFor(w, d).length} fit</span>${dimPills(w.dims)}</div>
            </div><span class="chev">${S.open === ref ? "⌃" : "›"}</span></button>
            ${S.open === ref ? `<div class="inline-ed">${windowEditor(ref)}</div>` : ""}`; }).join("")
            || `<div class="empty">No windows on this date.</div>`}
            <button class="row" data-act="addwin" data-d="${S.date}"><div class="body">
              <div class="title" style="color:var(--accent)">＋ Add a window</div></div></button></div>
          ${evs.length ? `<div class="sec-h">Events</div><div class="list">${evs.map(e => `<div class="row">
            <div class="body"><div class="title">${esc(e.name)}</div><div class="meta">
            <span class="pill dur">${hm(e.s)}–${hm(e.e)}</span>${dimPills(e.dims)}</div></div></div>`).join("")}</div>` : ""}
          <div class="sec"><button class="btn wide" data-act="sheet" data-kind="pick" data-param="stamp">
            Stamp a shape onto this date…</button></div>
          <div class="btn-row">
            <button class="btn" data-act="sheet" data-kind="event">＋ Event</button>
            <button class="btn" data-act="sheet" data-kind="promote">Save as a shape</button></div>
          ${overrideOn(S.date) ? `<div class="btn-row"><button class="btn danger wide" data-act="revert">
            Put it back on the pattern</button></div>` : ""}
          <div class="note">The same editor, the same fields — only the scope above it changed. The claim being
            tested is that a mode you set <b>deliberately</b> is safer than a scope you infer from your route.</div>
        </div>` + tabbar("schedule");
    },
  };

  /* ============================ variant S ============================ */
  // Three steps, not four. "Which days change?" was a question the canvas answers by being used —
  // and the diff against the season you copied is a derived fact, so asking for it up front was
  // storing what could be computed, the mistake this project has now refused four times.
  const STEPS = ["Start from", "Shape the week", "Check the damage"];
  const S_ = {
    name:"Season setup",
    tagline:"The season is a named, saved object and the Schedule tab's subject. Editing it — new or existing — "
      + "is W's week canvas, and creating one is a three-step flow that ends on the orphan check.",
    schedule() {
      if (S.wiz) return S_.wizard();
      const p = pattern();
      return nav("Schedule", { sub:`${p.name}` }) + `
        <div class="scroll">
          <div class="sec"><div class="lbl">Active season</div>
            <div style="font-size:26px;letter-spacing:-.03em;margin:6px 0 2px">${esc(p.name)}</div>
            <div style="font-size:13px;color:var(--ink-2)">${new Set(p.days).size} shapes in use ·
              ${p.days.reduce((n,t) => n + tpl(t).windows.length, 0)} windows a week ·
              ${orphans().length ? `<b style="color:var(--danger)">${orphans().length} tasks never fit</b>` : "every task has a home"}</div></div>
          <div class="btn-row">
            <button class="btn primary" data-act="go" data-screen="season">Edit this season</button>
            <button class="btn" data-act="wizstart">New season</button></div>
          <div class="sec-h with-tog">The week, at a glance ${viewToggle()}</div>
          <div class="list">${p.days.map((tid,i) => `<button class="row" data-act="go" data-screen="season" data-param="${i}">
            <div class="body"><div class="title">${WDL[i]} — ${esc(tpl(tid).name)}</div>
            ${S.dayview === "strip" ? strip(tpl(tid))
              : `<div class="meta">${tpl(tid).windows.map(w => `<span class="pill dur">${hm(w.s)}</span>`).join("")
                 || `<span class="pill ghost">silent all day</span>`}</div>`}</div>
            <span class="chev">›</span></button>`).join("")}</div>
          <div class="sec"><button class="btn wide" data-act="sheet" data-kind="pattern">Switch to a saved season</button></div>
          <div class="sec-h">Dates that depart from it</div>
          <div class="list">
            <button class="row" data-act="go" data-screen="date"><div class="body"><div class="title">Change one date</div>
              <div class="meta"><span class="pill">${OVERRIDES.length} overrides</span><span class="pill">${EVENTS.length} events</span></div></div><span class="chev">›</span></button>
          </div>
          ${footerBar()}
          <div class="note">The season is the object; the week is how you edit it. Naming and saving seasons is the
            thing this variant has that the others do not — so the summary leads with the name, and every route
            out of here says which of the two things it changes.</div>
        </div>` + tabbar("schedule");
    },
    // The gap Phil found: S could create a season but never edit the one it was standing in.
    // Same canvas as W, wrapped in the season's name so the scope is never in doubt.
    season() {
      const p = pattern();
      return nav(p.name, { back:"schedule", backLabel:"Schedule",
        sub:`Editing the season · every future week` }) + `
        <div class="scroll">
          <div class="sec-h with-tog">The week ${viewToggle()}</div>
          ${weekCanvas(p.days)}
          <div class="note">Changing a day here changes <b>${esc(p.name)}</b> itself — the other saved seasons are
            untouched, and switching back to one of them restores its week exactly. Editing a <b>shape</b> is wider
            still: the amber banner names every season that shares it.</div>
          <div class="btn-row">
            <button class="btn wide" data-act="go" data-screen="date">Change a single date instead →</button></div>
        </div>`;
    },
    wizard() {
      const w = S.wiz, step = S.step;
      const bar = `<div class="steps">${STEPS.map((_,i) =>
        `<div class="${i < step ? "done" : i === step ? "on" : ""}"></div>`).join("")}</div>`;
      const head = nav(w.name || "New season", { back:null, right:`<button class="icon" data-act="wizcancel">Cancel</button>` }) + bar;
      let body = "";
      if (step === 0) {
        body = `<div class="wizq"><h2>Start from what?</h2>
          <p>Seasons come back round, so nothing is ever rebuilt from nothing.</p></div>
          <div class="stack"><div class="lbl">Call it</div>
            <input class="field" value="${esc(w.name)}" data-wizname></div>
          <div class="sec-h">Copy the week from</div>
          <div class="list">${PATTERNS.map(p => `<button class="row" data-act="wizbase" data-v="${p.id}">
            <div class="body"><div class="title">${esc(p.name)}${p.id === activePattern ? " · active" : ""}</div>
            <div class="meta">${p.days.map((t,i) => `<span class="pill">${WD[i]} ${esc(tpl(t).name.split(" ")[0])}</span>`).join("")}</div></div>
            <span class="chev">${w.base === p.id ? "✓" : "›"}</span></button>`).join("")}</div>`;
      } else if (step === 1) {
        const base = PATTERNS.find(p => p.id === w.base);
        const changed = w.days.filter((t,i) => base && base.days[i] !== t).length;
        body = `<div class="wizq"><h2>Shape the week</h2>
          <p>Prepopulated with ${base ? `“${esc(base.name)}”` : "the current season"}. Change the days that moved
            and leave the rest — ${changed ? `<b>${changed} changed so far</b>` : "nothing changed yet"}.</p></div>
          ${weekCanvas(w.days)}
          <div class="note">This is the same canvas as the Schedule tab, so there is one way to edit a week and it
            does not matter whether you arrived here from a new season or an old one. Careful with a shape used by
            <b>another</b> season — the amber banner will say so, and <b>Clone to diverge</b> is the way out.</div>`;
      } else {
        const draft = { id:"draft", name:w.name, days:w.days };
        const lost = orphansUnder(draft), now = orphans();
        const newly = lost.filter(t => !now.some(x => x.id === t.id));
        body = `<div class="wizq"><h2>Before you switch</h2>
          <p>This is the whole reason the flow exists — the count arrives while you can still change the answer.</p></div>
          ${newly.length ? `<div class="damage"><div class="damage-h">${newly.length} active task${newly.length === 1 ? "" : "s"}
            would have nowhere to fire in “${esc(w.name)}”.</div>
            ${newly.map(t => `<div class="row"><div class="body"><div class="title">${esc(t.t)}</div>
              <div class="meta">${dimPills(t.dims)}<span class="pill dur">${durLabel(t.dur)}</span></div></div></div>`).join("")}</div>
            <div class="note">Each one needs some window in the new week to declare what it asks for. Fixing them is
              <b>#18's</b> job; arriving here knowing about them is this ticket's.</div>`
          : `<div class="sec"><div class="scope one"><span class="g">✓</span><span>Every active task still has a
              window that can admit it.</span></div></div>`}
          <div class="sec-h">The week you are committing to</div>
          <div class="list">${w.days.map((tid,i) => {
            const base = PATTERNS.find(p => p.id === w.base);
            const moved = base && base.days[i] !== tid;
            return `<div class="row"><div class="body">
              <div class="title">${WDL[i]} — ${esc(tpl(tid).name)}</div>
              <div class="meta">${moved
                ? `<span class="pill now">was ${esc(tpl(base.days[i]).name)}</span>`
                : `<span class="pill ghost">unchanged</span>`}
                ${tpl(tid).windows.map(win => `<span class="pill dur">${hm(win.s)}</span>`).join("")
                  || `<span class="pill ghost">silent</span>`}</div></div></div>`; }).join("")}</div>`;
      }
      const last = step === STEPS.length - 1;
      return head + `<div class="scroll">${body}</div>
        <div class="wizbar">
          <button class="btn" data-act="wizback">${step === 0 ? "Cancel" : "Back"}</button>
          <button class="btn primary" data-act="wiznext">${last ? "Switch to it" : "Next"}</button></div>`;
    },
    shape:() => P.shape(),
    date:() => W.date(),
  };

  const VARIANTS = { W, P, M, S:S_ };
  const KEYS = ["W","P","M","S"];

  /* ============================== render ============================== */
  function screenFor(V) {
    if (S.screen === "today") return shell.today();
    if (S.screen === "tasks") return shell.tasks();
    if (S.screen === "more")  return shell.more();
    const fn = V[S.screen] || V.schedule;
    return fn();
  }
  function render() {
    _ahead = new Map();
    const V = VARIANTS[S.variant] || W;
    let html = screenFor(V);
    if (S.sheet) {
      const k = S.sheet.kind;
      if (k === "capture") html += captureSheet();
      else if (k === "pattern") html += patternSheet();
      else if (k === "event") html += eventSheet(S.date);
      else if (k === "promote") html += promoteSheet(S.date);
      else if (k === "pick") {
        const [mode, wd] = String(S.sheet.param || "stamp").split(":");
        html += shapePickerSheet({ mode, wd:+wd });
      }
      else if (k === "win") html += `<div class="veil" data-act="closesheet"><div class="sheet" data-stop>
        <div class="grabber"></div>
        <div class="sheet-h"><h2>${esc((refWindow(S.sheet.param) || {name:"Window"}).name)}</h2>
          <button class="icon" data-act="closesheet">Done</button></div>
        ${scopeBanner(S.sheet.param, true)}${windowEditor(S.sheet.param)}</div></div>`;
    }
    document.getElementById("device").innerHTML = html;

    if (S.focusWd !== null && S.focusWd !== undefined) {
      const row = document.getElementById("day-" + S.focusWd);
      if (row && row.scrollIntoView) {
        row.scrollIntoView({ block:"start", behavior:"instant" });
        row.animate && row.animate(
          [{ background:"var(--accent-soft)" }, { background:"transparent" }],
          { duration:900, easing:"ease-out" });
      }
      S.focusWd = null;
    }

    document.getElementById("switcher").innerHTML = `
      <button data-sw="prev" aria-label="Previous variant">‹</button>
      <button class="label" data-sw="about"><b>${S.variant}</b> — ${esc(V.name)}
        <span class="hint">· tap for notes</span></button>
      <button data-sw="next" aria-label="Next variant">›</button>`;

    const old = document.querySelector(".about"); if (old) old.remove();
    if (S.about) {
      const el = document.createElement("div"); el.className = "about";
      el.innerHTML = `<div class="about-in" data-stop>
        <div class="kicker">Variant ${S.variant} of ${KEYS.length} · schedule editing · issue #17</div>
        <h2>${esc(V.name)}</h2><p>${esc(V.tagline)}</p>
        <div class="kicker" style="margin-top:14px">The six surfaces, and where each one lives here</div>
        <ul>
          <li><b>Window editor</b> — ${esc(V === W ? "expands inline under the week" : V === P ? "a sheet off the timeline block" : V === M ? "inline, under whichever mode you chose" : "inline inside the wizard step")}</li>
          <li><b>Shape + usage list</b> — ${esc(V === W ? "the week rows are the shapes; usage is in the banner" : V === P ? "reached after promoting, with its own usage screen" : V === M ? "the whole of shape mode" : "the picker groups by use; the banner names every season sharing a shape")}</li>
          <li><b>Pattern editor</b> — ${esc(V === W ? "change ▾ on any weekday row" : V === P ? "assign chips on a shape screen" : V === M ? "above the windows, in shape mode" : "Edit this season, and wizard step 2 — the same canvas either way")}</li>
          <li><b>Pattern switcher</b> — ${esc(V === S_ ? "a sheet, plus the wizard's last step on the path out" : "a sheet, with the orphan count precomputed per season")}</li>
          <li><b>Override a date</b> — ${esc(V === W ? "a separate list, deliberately not mixed with shapes" : V === P ? "the home screen; it is all you can edit directly" : V === M ? "the other half of the toggle" : "Change one date, under the season summary")}</li>
          <li><b>Event + overlap</b> — ${esc("＋ Event on a date, then replace / truncate / split, applied for real")}</li>
        </ul>
        <div class="kicker" style="margin-top:14px">Things worth poking</div>
        <ul>
          <li>Open a window editor and watch the <b>scope banner</b>. Shared shapes are amber, single dates green.</li>
          <li>Any <b>change ▾</b> opens the shape picker — ${TEMPLATES.length} shapes, grouped by use, each with a strip showing where its windows sit.</li>
          <li><b>Duration</b> is now a sentence at the bottom of the editor, not a control; <b>Weather</b> keeps a read-only row because its source is nowhere else on the screen.</li>
          <li>Switch season and read the <b>orphan count per pattern</b>, computed before you commit.</li>
          <li>Add an event at 7p on a day with an evening window to hit <b>replace / truncate / split</b>.</li>
          <li>Data is shared across all four variants, so the comparison holds.</li>
        </ul>
        <div style="display:flex;justify-content:flex-end;margin-top:16px">
          <button class="btn primary" data-sw="close">Close</button></div></div>`;
      document.body.appendChild(el);
    }
  }

  /* ============================== events ============================== */
  document.addEventListener("click", e => {
    const sw = e.target.closest("[data-sw]");
    if (sw) {
      const k = sw.dataset.sw;
      if (k === "about") { S.about = !S.about; render(); return; }
      if (k === "close") { S.about = false; render(); return; }
      cycle(k === "next" ? 1 : -1); return;
    }
    if (e.target.closest(".about") && !e.target.closest("[data-stop]")) { S.about = false; render(); return; }

    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act;
    if (a === "closesheet" && el.classList.contains("veil") && e.target.closest("[data-stop]")) return;
    if (a !== "delwin") S.confirmDel = null;   // any other tap disarms the delete

    switch (a) {
      case "go": go(el.dataset.screen, el.dataset.param || null); break;
      case "sheet": sheet(el.dataset.kind, el.dataset.param); break;
      case "closesheet": sheet(null); break;
      case "expand": S.open = S.open === el.dataset.v ? null : (el.dataset.v || null); render(); break;
      case "pickassign": {
        const days = S.wiz ? S.wiz.days : pattern().days;
        days[+el.dataset.wd] = el.dataset.v;
        sheet(null); break;
      }
      case "pickstamp": stamp(S.date, el.dataset.v); S.open = null; sheet(null); break;
      case "dayview": S.dayview = el.dataset.v; render(); break;
      case "delwin": {
        const ref = el.dataset.ref;
        if (S.confirmDel !== ref) { S.confirmDel = ref; render(); break; }
        const c = refCtx(ref);
        const list = c.scope === "template" ? tpl(c.tplId).windows
                   : (materialise(c.dateKey), overrideOn(c.dateKey).windows);
        const i = list.findIndex(x => x.id === c.winId);
        if (i >= 0) list.splice(i, 1);
        S.confirmDel = null; S.open = null; S.sheet = null; render(); break;
      }
      case "mode": S.mode = el.dataset.v; S.open = null; render(); break;
      case "mwd": S.mwd = +el.dataset.v; S.open = null; render(); break;
      case "pickdate": S.date = el.dataset.v; S.open = null; if (S.screen === "schedule" && S.variant === "W") go("date"); else render(); break;
      case "filter": S.filter = el.dataset.v; render(); break;
      case "toggle": { const t = task(+el.dataset.id); t.st = t.st === "Done" ? "Active" : "Done"; render(); break; }
      case "setwdim": {
        const w = refWindow(el.dataset.ref, true) || refWindow(el.dataset.ref);
        const d = dim(el.dataset.k);
        toggleDim(w, d, el.dataset.v, d.winDef); render(); break;
      }
      case "assign": {
        if (S.wiz) { S.wiz.days = S.wiz.days.slice(); S.wiz.days[+el.dataset.wd] = el.dataset.v; }
        else { const p = pattern(); p.days = p.days.slice(); p.days[+el.dataset.wd] = el.dataset.v; }
        S.swap = null; render(); break;
      }
      case "stamp": stamp(S.date, el.dataset.v); S.open = null; render(); break;
      case "revert": revertDate(S.date); S.open = null; render(); break;
      case "addwin": {
        const id = "w" + (++SEQ);
        if (el.dataset.t) tpl(el.dataset.t).windows.push(W_(id, "New window", "13:00", "14:00", {}));
        else { const ov = materialise(el.dataset.d || S.date);
               ov.windows.push(W_(id, "New window", "13:00", "14:00", {}));
               ov.windows.sort((x,y) => mins(x.s) - mins(y.s)); }
        S.open = el.dataset.t ? `tpl:${el.dataset.t}:${id}` : `date:${el.dataset.d || S.date}:${id}`;
        render(); break;
      }
      case "clone": {
        const src = tpl(el.dataset.t), id = "t" + (++SEQ);
        TEMPLATES.push({ id, name:src.name + " (copy)", protos:[],
          windows:src.windows.map(w => ({ ...cloneWin(w), id:"w"+(++SEQ) })) });
        const days = S.wiz ? S.wiz.days : pattern().days;
        const wd = el.dataset.wd !== undefined ? +el.dataset.wd
                 : S.variant === "M" && S.mode === "shape" ? S.mwd
                 : days.indexOf(src.id);
        if (wd >= 0) days[wd] = id;
        S.open = null; render(); break;
      }
      case "overlap": applyOverlap(el.dataset.d, el.dataset.w, el.dataset.v); sheet(null); break;
      case "addevent": {
        EVENTS.push({ id:"e"+(++SEQ), name:S.ev.name, date:el.dataset.d, s:S.ev.s, e:S.ev.e, dims:{} });
        sheet(null); break;
      }
      case "dopromote": {
        const inp = document.querySelector("[data-promo]");
        promote(el.dataset.d, (inp && inp.value.trim()) || "New shape");
        sheet(null); break;
      }
      case "setpattern": {
        activePattern = el.dataset.v;
        const p = pattern(); if (!p.days.includes(tpl(p.days[S.mwd]).id)) S.mwd = today.getDay();
        sheet(null); break;
      }
      case "capture": {
        const inp = document.querySelector(".sheet input.field");
        const v = el.dataset.v;
        TASKS.unshift({ id:Date.now(), t:(inp && inp.value.trim()) || "New task",
          dur:v === "Longer" ? "Longer" : +v, st:"Active", dims:{} });
        sheet(null); break;
      }
      /* ---- S's wizard ---- */
      case "wizstart": {
        const p = pattern();
        S.wiz = { name:"New season", base:p.id, days:p.days.slice() };
        S.step = 0; S.open = null; render(); break;
      }
      case "wizcancel": S.wiz = null; S.step = 0; S.open = null; render(); break;
      case "wizbase": {
        S.wiz.base = el.dataset.v;
        S.wiz.days = PATTERNS.find(p => p.id === el.dataset.v).days.slice();
        render(); break;
      }
      case "wizback": {
        if (S.step === 0) S.wiz = null; else S.step--;
        S.open = null; render(); break;
      }
      case "wiznext": {
        const nameInp = document.querySelector("[data-wizname]");
        if (nameInp) S.wiz.name = nameInp.value.trim() || "New season";
        if (S.step === STEPS.length - 1) {
          PATTERNS.push({ id:"p" + (++SEQ), name:S.wiz.name, days:S.wiz.days.slice() });
          activePattern = PATTERNS[PATTERNS.length - 1].id;
          S.wiz = null; S.step = 0;
        } else S.step++;
        S.open = null; render(); break;
      }
      default: break;
    }
  });

  document.addEventListener("change", e => {
    const evt = e.target.closest("[data-evtime]");
    if (evt) {
      const v = parseTime(evt.value);
      const other = evt.dataset.f === "s" ? S.ev.e : S.ev.s;
      if (!v || (evt.dataset.f === "s" ? mins(v) >= mins(other) : mins(v) <= mins(other))) {
        evt.classList.add("bad"); return;
      }
      S.ev[evt.dataset.f] = v; render(); return;
    }
    const evn = e.target.closest("[data-evname]");
    if (evn) { S.ev.name = evn.value.trim() || S.ev.name; render(); return; }

    const t = e.target.closest("[data-time]");
    if (t) {
      const v = parseTime(t.value);
      if (!v) { t.classList.add("bad"); return; }
      const w = refWindow(t.dataset.ref, true) || refWindow(t.dataset.ref);
      const other = t.dataset.f === "s" ? w.e : w.s;
      if (t.dataset.f === "s" ? mins(v) >= mins(other) : mins(v) <= mins(other)) { t.classList.add("bad"); return; }
      w[t.dataset.f] = v; render(); return;
    }
    const r = e.target.closest("[data-rename]");
    if (r) { const w = refWindow(r.dataset.ref, true) || refWindow(r.dataset.ref);
             w.name = r.value.trim() || w.name; render(); }
  });

  function cycle(dir) {
    S.variant = KEYS[(KEYS.indexOf(S.variant) + dir + KEYS.length) % KEYS.length];
    S.screen = "schedule"; S.param = null; S.sheet = null; S.open = null; S.swap = null;
    S.wiz = null; S.step = 0; S.mode = "shape";
    const u = new URL(location.href); u.searchParams.set("variant", S.variant);
    history.replaceState(null, "", u);
    render();
  }

  document.addEventListener("keydown", e => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (e.key === "ArrowLeft") cycle(-1);
    else if (e.key === "ArrowRight") cycle(1);
    else if (e.key === "Escape" && (S.sheet || S.about)) { S.sheet = null; S.about = false; render(); }
  });

  render();
})();
</script>
