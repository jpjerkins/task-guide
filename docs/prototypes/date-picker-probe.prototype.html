<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Date picker probe — #46</title>
<!--
  PROBE for https://github.com/jpjerkins/task-guide/issues/46

  The observation: on iPhone, the native <input type="date"> picker opens and
  dismisses itself in under a second. Observed inside a published artifact — an
  iframe with a restrictive sandbox — so the first job is to find out whether the
  defect is Mobile Safari's at all.

  This page is PLAIN. No iframe, no sandbox, no framework, no CDN, served over
  Tailscale Serve as a same-origin static file. If row 1 misbehaves here, Safari
  is broken. If row 1 is fine and row 3 misbehaves, the prototype broke its own
  date field and Safari is innocent.

  The hypothesis row 3 tests comes from the tag entry prototype itself
  (docs/prototypes/tag-entry.prototype.html):

      document.addEventListener("input", e => {
        if (act === "deadline") { t.deadline = e.target.value; ... return render(); }
        if (act === "deferdate") { t.defer.date = e.target.value; }   // no render()
      });

  render() does `document.getElementById("device").innerHTML = ...`, which
  DESTROYS the very <input> the open picker is attached to. Deadline re-renders;
  Defer's date does not. That asymmetry is already shipped, and it is the
  cheapest possible control: if the defect is the re-render, Deadline dismisses
  and Defer does not.
-->
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --mut:#666; --line:#d8d8dc;
          --card:#f7f7f9; --ok:#0a7d32; --bad:#b3261e; --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --fg:#ececf0; --mut:#9a9aa2; --line:#33333a;
            --card:#1d1d21; --ok:#5ad07f; --bad:#ff8a80; --accent:#8ab4f8; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px 14px 64px; background:var(--bg); color:var(--fg);
         font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--mut); font-size:13.5px; margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:12px 12px 10px; margin:0 0 14px; }
  .hd { display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .n { font-weight:700; font-size:13px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .ti { font-weight:600; font-size:15px; }
  .why { color:var(--mut); font-size:12.5px; margin:2px 0 10px; }
  input[type=date] { font:inherit; font-variant-numeric:tabular-nums; padding:9px 10px;
                     border:1px solid var(--line); border-radius:9px; background:var(--bg);
                     color:var(--fg); min-height:44px; width:100%; max-width:230px; }
  .log { margin-top:9px; font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
         color:var(--mut); white-space:pre-wrap; word-break:break-word;
         max-height:104px; overflow:auto; border-top:1px dashed var(--line); padding-top:7px; }
  .log:empty::before { content:"— no events yet —"; opacity:.55; }
  .verdict { display:flex; gap:8px; margin-top:9px; }
  .verdict button { flex:1; font:inherit; font-size:14px; min-height:44px; border-radius:9px;
                    border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .verdict button[aria-pressed=true] { border-color:currentColor; font-weight:650; }
  .verdict button.ok[aria-pressed=true]  { color:var(--ok); }
  .verdict button.bad[aria-pressed=true] { color:var(--bad); }
  .xform { transform:translateZ(0); will-change:transform; }
  .fixed-ctx { position:relative; transform:translateY(0); }
  #summary { position:sticky; bottom:0; margin:20px -14px -64px; padding:14px;
             background:var(--card); border-top:1px solid var(--line);
             font:12.5px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; }
  .note { font-size:12.5px; color:var(--mut); margin:14px 0 0; }
</style>

<h1>Date picker probe</h1>
<p class="sub">Plain page, same origin, no iframe, no framework.
Open each picker, wait two seconds, then mark whether it stayed open.</p>

<div id="rows"></div>

<p class="note">Row 1 is the control. If row 1 stays open, Mobile Safari is not the
problem and the defect belongs to whatever the page does on <code>input</code>.</p>

<div id="summary"></div>

<script>
/* Each row is isolated: its own container, its own input, its own log.
   The point is that exactly one variable changes between rows. */
const ROWS = [
  { id:"bare", title:"Bare input, zero JS",
    why:"The control. Nothing is listening. If this dismisses, the bug is Safari's.",
    wire(){} },

  { id:"listen", title:"Passive listener",
    why:"An input listener that only writes to the log and never touches the DOM.",
    wire(el, log){ el.addEventListener("input", () => log("input " + el.value)); } },

  { id:"rerender", title:"innerHTML re-render on input",
    why:"Exactly what the tag entry prototype's Deadline field does: the input event " +
        "triggers a full innerHTML rebuild, destroying the node the picker is attached to.",
    wire(el, log, box){
      document.addEventListener("input", e => {
        if (e.target !== box.querySelector("input")) return;
        const v = e.target.value;
        log("input " + v + " → innerHTML rebuild");
        box.innerHTML = '<input type="date" value="' + v + '">';
      });
    } },

  { id:"controlled", title:"Value written back, same node",
    why:"React's controlled-input pattern where reconciliation keeps the element. " +
        "The node survives; only its value is reassigned.",
    wire(el, log){
      el.addEventListener("input", () => { log("input " + el.value + " → value reassigned");
                                           el.value = el.value; }); } },

  { id:"replace", title:"Node replaced with a fresh one",
    why:"React's other outcome — a changed key, so the old element is swapped out " +
        "for an identical new one. Same effect as row 3 but without innerHTML.",
    wire(el, log, box){
      box.addEventListener("input", e => {
        if (e.target.type !== "date") return;
        const fresh = document.createElement("input");
        fresh.type = "date"; fresh.value = e.target.value;
        log("input " + e.target.value + " → replaceChild");
        box.replaceChild(fresh, e.target);
      }); } },

  { id:"transform", title:"Inside a transformed ancestor",
    why:"A transform/will-change ancestor creates a containing block, which has " +
        "historically confused WebKit's positioning of native popovers. No JS.",
    wire(){}, cls:"xform" },

  { id:"blur", title:"Focus handler that blurs siblings",
    why:"A focus manager that calls blur() on other fields — a common SPA pattern " +
        "that can steal focus back from the picker.",
    wire(el, log, box){
      el.addEventListener("focus", () => {
        log("focus → blurring siblings");
        document.querySelectorAll("input[type=date]").forEach(o => { if (o !== el) o.blur(); });
      });
      el.addEventListener("blur", () => log("blur"));
    } },
];

const results = {};
const wrap = document.getElementById("rows");

ROWS.forEach((r, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="hd"><span class="n">' + (i + 1) + '</span><span class="ti"></span></div>' +
    '<p class="why"></p>' +
    '<div class="box' + (r.cls ? " " + r.cls : "") + '"><input type="date"></div>' +
    '<div class="log"></div>' +
    '<div class="verdict">' +
      '<button class="ok"  data-v="stayed">stayed open</button>' +
      '<button class="bad" data-v="dismissed">dismissed itself</button>' +
    '</div>';
  card.querySelector(".ti").textContent = r.title;
  card.querySelector(".why").textContent = r.why;

  const box = card.querySelector(".box");
  const logEl = card.querySelector(".log");
  const t0 = Date.now();
  const log = m => { logEl.textContent += (Date.now() - t0) + "ms  " + m + "\n";
                     logEl.scrollTop = logEl.scrollHeight; };

  const el = box.querySelector("input");
  /* Every row logs the lifecycle, so the trace shows WHEN the picker died even
     when the row itself is meant to be inert. */
  el.addEventListener("focus", () => log("focus"));
  el.addEventListener("blur",  () => log("blur  ← picker closed"));
  el.addEventListener("change", () => log("change " + el.value));

  r.wire(el, log, box);

  card.querySelector(".verdict").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    results[r.id] = b.dataset.v;
    card.querySelectorAll(".verdict button")
        .forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    summarise();
  });

  wrap.appendChild(card);
});

function summarise(){
  const lines = ROWS.map((r, i) =>
    (i + 1) + ". " + r.title.padEnd(34, " ").slice(0, 34) + "  " +
    (results[r.id] || "—"));
  document.getElementById("summary").textContent =
    "#46 probe · " + navigator.userAgent.replace(/^Mozilla\/5\.0 /, "") + "\n\n" +
    lines.join("\n");
}
summarise();
</script>
